<script>
const REGIONS = {
  '台北': { 經度: 121.31, 時區: 8, 說明: '台北（UTC+8）' },
  '無':   { 經度: 120,    時區: 8, 說明: '不校正' }
};
let currentRegion = '台北';

function getEquationOfTime(date) {
  const start = new Date(date.getFullYear(), 0, 0);
  const dayOfYear = Math.floor((date - start) / 86400000);
  const B = 2 * Math.PI * (dayOfYear - 81) / 364;
  return 9.87 * Math.sin(2 * B) - 7.53 * Math.cos(B) - 1.5 * Math.sin(B);
}
function getRegionOffset(localDate, regionName) {
  if (regionName === '無') return 0;
  const r = REGIONS[regionName];
  const 經度校正 = (r.經度 - 120) * 4;
  const 均時差 = getEquationOfTime(localDate);
  return 經度校正 + 均時差;
}

function getXunShou(shiGan, shiZhi) {
  const ganIdx = '甲乙丙丁戊己庚辛壬癸'.indexOf(shiGan);
  const zhiIdx = ZHI.indexOf(shiZhi);
  if (ganIdx < 0 || zhiIdx < 0) return null;
  const xunZhiIdx = (zhiIdx - ganIdx + 12) % 12;
  return '甲' + ZHI[xunZhiIdx];
}
function getMaZhi(shiZhi) {
  const g1 = ['申','子','辰'], g2 = ['寅','午','戌'], g3 = ['巳','酉','丑'], g4 = ['亥','卯','未'];

  if (g2.includes(shiZhi)) return '申';
  if (g3.includes(shiZhi)) return '亥';
  if (g4.includes(shiZhi)) return '巳';
  return null;
}

function getKeyingFromTable(tianGan, diGan) {
  return KEYING_TABLE[tianGan + diGan] || null;
}

// ============================================================
// 暗干計算
// ============================================================
function computeAnGan(obj) {
  const zhiFuGongChar = obj.值符落宮 || '';
  const GONG_CHAR_TO_LUOSHU = {
    '坎': 1, '坤': 2, '震': 3, '巽': 4, '中': 5,
    '乾': 6, '兌': 7, '艮': 8, '離': 9
  };
  const startLuoshu = GONG_CHAR_TO_LUOSHU[zhiFuGongChar];
  if (!startLuoshu) return {};

  const NINE_GAN = ['戊','己','庚','辛','壬','癸','丙','乙','丁'];
  const anGanMap = {};
  let ganIdx = 0;
  let luoshu = startLuoshu;
  let steps = 0;
  while (ganIdx < 8 && steps < 20) {
    if (luoshu !== 5) {
      anGanMap[luoshu] = NINE_GAN[ganIdx];
      ganIdx++;
    }
    luoshu = ((luoshu - 2 + 9) % 9) + 1;
    steps++;
  }
  return anGanMap;
}

function pad(n) { return String(n).padStart(2, '0'); }
function nowLocalStr() {
  const d = new Date();
  return `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}T${pad(d.getHours())}:${pad(d.getMinutes())}`;
}
function toQimenDatetime(localStr, regionName) {
  const d = new Date(localStr);
  const offset = getRegionOffset(d, regionName);
  const corrected = new Date(d.getTime() + offset * 60 * 1000);
  return {
    datetime: `${corrected.getFullYear()}${pad(corrected.getMonth()+1)}${pad(corrected.getDate())}${pad(corrected.getHours())}`,
    displayTime: corrected,
    offset: offset
  };
}

function paipan() {
  const timeStr = document.getElementById('qTime').value;
  if (!timeStr) { alert('請選擇時間'); return; }

  const { datetime, displayTime, offset } = toQimenDatetime(timeStr, currentRegion);
  let chart, obj, patterns;
  try {
    chart = Qimen.generateChartByDatetime(datetime, { 定局法: '符頭' });
    obj = Qimen.chartToObject(chart);
    patterns = Qimen.detectPatterns(obj);
  } catch (e) {
    document.getElementById('panInfo').innerHTML = `<div style="color:#e07b7b">排盤錯誤：${e.message}</div>`;
    document.getElementById('palaceGrid').innerHTML = '';
    return;
  }

  const shiZhu = obj.時柱 || '';
  const shiGan = shiZhu[0] || '';
  const shiZhi = shiZhu[1] || '';

  const maZhi = getMaZhi(shiZhi);
  const xunShou = getXunShou(shiGan, shiZhi);
  const kongZhi = xunShou ? (XUN_KONG[xunShou] || []) : [];
  const anGanMap = computeAnGan(obj);

  renderInfo(obj, displayTime, currentRegion, maZhi, xunShou, kongZhi, offset);
  renderGrid(obj, patterns, maZhi, kongZhi, anGanMap);
}

function renderInfo(obj, displayTime, regionName, maZhi, xunShou, kongZhi, offset) {
  const dun = obj.陰陽 === '陽' ? '陽遁' : '陰遁';
  const r = REGIONS[regionName];
  const timeStr = `${displayTime.getFullYear()}-${pad(displayTime.getMonth()+1)}-${pad(displayTime.getDate())} ${pad(displayTime.getHours())}:${pad(displayTime.getMinutes())}:${pad(displayTime.getSeconds())}`;
  document.getElementById('panInfo').innerHTML = `
    <div>地區<span>${regionName}</span></div>
    <div>經度<span>${r.經度}°</span></div>
    <div>真太陽時<span>${timeStr}</span></div>
    <div>節氣<span>${obj.節氣 || '—'}</span></div>
    <div>三元<span>${obj.三元 || '—'}</span></div>
    <div>局數<span>${dun} ${obj.局數 || '—'} 局</span></div>
    <div>四柱<span>${obj.年柱} ${obj.月柱} ${obj.日柱} ${obj.時柱}</span></div>
    <div>旬首<span>${xunShou || obj.旬首 || '—'}</span></div>
    <div>旬空<span>${kongZhi.join('、') || '—'}</span></div>
    <div>馬星<span>${maZhi || '—'}</span></div>
    <div>值符<span>${obj.值符 || '—'}</span></div>
    <div>值使<span>${obj.值使 || '—'}</span></div>
    <div>值符落宮<span>${obj.值符落宮 || '—'}</span></div>
  `;

  const noticeEl = document.getElementById('noticeBar');
  let baseNotice = '';
  if (regionName === '無') {
    baseNotice = '⚠ 目前為「不校正」模式，直接以北京時間排盤。';
  } else {
    const 經度校正 = (r.經度 - 120) * 4;
    const 均時差 = getEquationOfTime(displayTime);
    baseNotice = `⚠ ${regionName}真太陽時校正：經度 ${r.經度}° → 經度校正 ${經度校正.toFixed(2)} 分 + 均時差 ${均時差.toFixed(2)} 分 = 總校正 ${offset.toFixed(2)} 分。`;
  }
  noticeEl.innerHTML = baseNotice + `<br>🐎 馬星：${maZhi || '—'} ｜ ⭕ 旬空：${kongZhi.join('、') || '—'}<br>🔸 暗干：值符落宮起，逆飛，順序 戊己庚辛壬癸丙乙丁（只放 8 干）。`;
}

function renderGrid(obj, patterns, maZhi, kongZhi, anGanMap) {
  const grid = document.getElementById('palaceGrid');
  const di = obj.地盤 || [];
  const tian = obj.天盤 || [];
  const men = obj.天門 || [];
  const xing = obj.九星 || [];
  const shen = obj.八神 || [];

  const GONG_CHAR = {
    0: '巽', 1: '離', 2: '坤',
    3: '震', 4: '中', 5: '兌',
    6: '艮', 7: '坎', 8: '乾'
  };

  const anGanByIdx = {};
  for (const luoshu in anGanMap) {
    const idx = LUOSHU_TO_IDX[luoshu];
    if (idx !== undefined) anGanByIdx[idx] = anGanMap[luoshu];
  }

  grid.innerHTML = GONG_LAYOUT.map(g => {
    const gongChar = GONG_CHAR[g.idx];
    const tg = tian[g.idx] || '';
    const dg = di[g.idx] || '';
    const ag = anGanByIdx[g.idx] || '';

    const hasMa = maZhi && gongHasZhi(g, maZhi);
    const hasKong = kongZhi.some(kz => gongHasZhi(g, kz));

    let keyingHTML = '';
    if (gongChar !== '中') {
      const lines = [];

      // 第一條：天盤干 + 地盤干
      if (tg && dg) {
        const k = getKeyingFromTable(tg, dg);
        if (k) {
          const geText = k.格 ? `為${k.格}，` : '';
          lines.push(`<div class="line"><span class="kh">${tg}加${dg}：</span>${geText}${k.斷語 || ''}</div>`);
        } else {
          lines.push(`<div class="line"><span class="kh">${tg}加${dg}：</span><span class="empty">（無資料）</span></div>`);
        }
      }

      // 第二條：暗干 + 地盤干
      if (ag && dg) {
        const k2 = getKeyingFromTable(ag, dg);
        if (k2) {
          const geText = k2.格 ? `為${k2.格}，` : '';
          lines.push(`<div class="line"><span class="kh">${ag}加${dg}：</span>${geText}${k2.斷語 || ''}</div>`);
        } else {
          lines.push(`<div class="line"><span class="kh">${ag}加${dg}：</span><span class="empty">（無資料）</span></div>`);
        }
      }

      keyingHTML = lines.join('') || '<div class="empty">（無克應）</div>';
    } else {
      keyingHTML = `<div class="empty">（中宮寄坤，不列克應）</div>`;
    }

    const maHTML = hasMa ? `<span class="ma-star">馬</span>` : '';
    const kongHTML = hasKong ? `<span class="kong-mark">○</span>` : '';

    return `
      <div class="palace">
        ${maHTML}
        <div class="palace-header">
          <span><span class="name">${g.name}</span> <span class="luoshu">(${g.luoshu})</span></span>
          <span class="dir">${g.dir}（${g.wuxing}）</span>
        </div>
        <div class="palace-main">
          <div class="palace-left">
            <div class="shen">${shen[g.idx] || '—'}${kongHTML}</div>
            <div class="xing">${xing[g.idx] || '—'}</div>
            <div class="men">${men[g.idx] || '—'}</div>
          </div>
          <div class="palace-right">
            <div class="gan-tian">${tg || '　'}</div>
            <div class="gan-di">${dg || '　'}</div>
            <div class="gan-an">${ag || '　'}</div>
          </div>
        </div>
        <div class="palace-dots">
          <span></span><span></span><span></span><span></span><span></span>
        </div>
        <div class="palace-keying">${keyingHTML}</div>
      </div>
    `;
  }).join('');
}

document.addEventListener('DOMContentLoaded', () => {
  document.getElementById('qTime').value = nowLocalStr();
  document.getElementById('btnPaipan').addEventListener('click', paipan);
  document.getElementById('btnNow').addEventListener('click', () => {
    document.getElementById('qTime').value = nowLocalStr();
    paipan();
  });

  document.querySelectorAll('.region-btn').forEach(btn => {
    btn.addEventListener('click', () => {
      document.querySelectorAll('.region-btn').forEach(b => b.classList.remove('active'));
      btn.classList.add('active');
      currentRegion = btn.dataset.region;
      paipan();
    });
  });

  paipan();
});
