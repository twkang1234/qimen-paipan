<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>奇門遁甲排盤</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    background: #0d0f14;
    color: #e8e3d8;
    font-family: "Noto Serif TC", "Songti TC", "PingFang TC", "Microsoft JhengHei", serif;
    line-height: 1.7;
    padding: 20px;
  }
  .container { max-width: 1100px; margin: 0 auto; }
  h1 {
    text-align: center;
    color: #c9a961;
    font-size: 28px;
    letter-spacing: 4px;
    margin-bottom: 6px;
  }
  .sub { text-align: center; color: #9a958a; font-size: 13px; margin-bottom: 28px; }

  .toolbar {
    display: flex;
    flex-wrap: wrap;
    gap: 14px;
    align-items: flex-end;
    padding: 20px;
    background: #151922;
    border: 1px solid #2a3142;
    border-radius: 10px;
    margin-bottom: 24px;
  }
  .field label { display: block; font-size: 12px; color: #9a958a; margin-bottom: 4px; }
  .field input {
    background: #1c2230;
    border: 1px solid #2a3142;
    color: #e8e3d8;
    padding: 8px 12px;
    border-radius: 6px;
    font-family: inherit;
    font-size: 14px;
  }
  .btn {
    background: linear-gradient(180deg, #c9a961, #8a7440);
    color: #1a1408;
    border: none;
    padding: 9px 24px;
    border-radius: 6px;
    font-family: inherit;
    font-size: 14px;
    font-weight: 700;
    cursor: pointer;
    letter-spacing: 2px;
  }
  .btn:hover { filter: brightness(1.1); }
  .btn.ghost { background: transparent; border: 1px solid #8a7440; color: #c9a961; font-weight: 400; }

  .info {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(150px, 1fr));
    gap: 10px 24px;
    padding: 16px 20px;
    background: #151922;
    border: 1px solid #2a3142;
    border-radius: 8px;
    margin-bottom: 24px;
    font-size: 14px;
  }
  .info span { color: #c9a961; font-weight: 600; margin-left: 4px; }

  .grid {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 1px;
    background: #2a3142;
    border: 1px solid #2a3142;
    border-radius: 8px;
    overflow: hidden;
    margin-bottom: 24px;
  }
  .palace {
    background: #151922;
    padding: 12px 12px 10px;
    min-height: 150px;
    position: relative;
  }
  .palace .gong { position: absolute; top: 8px; right: 10px; font-size: 11px; color: #5a6378; }
  .palace .name { font-size: 12px; color: #8a7440; margin-bottom: 6px; }
  .palace .row { font-size: 13px; margin: 3px 0; letter-spacing: 1px; }
  .palace .shen { color: #b98bd8; }
  .palace .xing { color: #6fb3d8; }
  .palace .men { color: #d8b26f; }
  .palace .gan-top { color: #e07b7b; font-size: 16px; font-weight: 700; }
  .palace .gan-bot { color: #7be0a8; font-size: 14px; }
  .palace .stack { display: flex; justify-content: space-between; margin-top: 8px; }

  .notice {
    padding: 12px 16px;
    background: rgba(122,31,31,.15);
    border-left: 3px solid #7a1f1f;
    border-radius: 0 6px 6px 0;
    font-size: 13px;
    color: #9a958a;
    margin-bottom: 24px;
  }

  .section-title {
    color: #c9a961;
    font-size: 18px;
    margin: 32px 0 12px;
    letter-spacing: 2px;
    border-bottom: 1px solid #2a3142;
    padding-bottom: 8px;
  }
  .keying { font-size: 14px; }
  .keying-item {
    padding: 12px 16px;
    border-bottom: 1px solid #1c2230;
    display: flex;
    flex-wrap: wrap;
    align-items: baseline;
    gap: 8px;
  }
  .keying-item .gong {
    color: #8a7440;
    font-size: 12px;
    min-width: 36px;
  }
  .keying-item .ge {
    color: #c9a961;
    font-weight: 700;
    min-width: 60px;
  }
  .keying-item .duan {
    color: #c8c3b8;
    flex: 1;
  }
  .keying-item .ji { font-size: 12px; padding: 1px 8px; border-radius: 10px; }
  .keying-item .ji.吉 { background: rgba(76,175,80,.2); color: #7be0a8; }
  .keying-item .ji.凶 { background: rgba(244,67,54,.2); color: #e07b7b; }

  .loading { text-align: center; color: #5a6378; padding: 20px; }
  footer { text-align: center; color: #5a6378; font-size: 12px; padding: 40px 0 20px; }
</style>
</head>
<body>
<div class="container">
  <h1>奇門遁甲排盤</h1>
  <div class="sub">拆補法 · 真太陽時校正 · 十干克應</div>

  <div class="toolbar">
    <div class="field">
      <label>起局時間</label>
      <input type="datetime-local" id="qTime">
    </div>
    <div class="field">
      <label>真太陽時校正（經度）</label>
      <input type="number" id="qLongitude" value="121.31" step="0.01" style="width:120px">
    </div>
    <button class="btn" id="btnPaipan">起 局</button>
    <button class="btn ghost" id="btnNow">用現在時間</button>
  </div>

  <div class="info" id="panInfo"></div>
  <div class="grid" id="palaceGrid"></div>

  <div class="notice">
    ⚠ 真太陽時校正：以經度 120°E 為基準，每偏離 1° 校正約 4 分鐘。台北 121.31° → 校正約 +5.24 分鐘。
    本盤採「拆補法」定局。排盤核心為 qimen-dunjia v3.1.0。
  </div>

  <div class="section-title">十干克應</div>
  <div class="keying" id="keyingList"></div>

  <footer>qimen-dunjia v3.1.0 · 拆補法 · 資料僅供參考</footer>
</div>

<!-- 引入核心：同目錄下的檔案 -->
<script src="qimen.standalone.min.js"></script>
<script>
// ============================================================
// 常數
// ============================================================
const GONG_LAYOUT = [
  { idx: 0, luoshu: 4, name: '巽宮', dir: '東南' },
  { idx: 1, luoshu: 9, name: '離宮', dir: '南' },
  { idx: 2, luoshu: 2, name: '坤宮', dir: '西南' },
  { idx: 3, luoshu: 3, name: '震宮', dir: '東' },
  { idx: 4, luoshu: 5, name: '中宮', dir: '中' },
  { idx: 5, luoshu: 7, name: '兌宮', dir: '西' },
  { idx: 6, luoshu: 8, name: '艮宮', dir: '東北' },
  { idx: 7, luoshu: 1, name: '坎宮', dir: '北' },
  { idx: 8, luoshu: 6, name: '乾宮', dir: '西北' }
];

// ============================================================
// 工具
// ============================================================
function pad(n) { return String(n).padStart(2, '0'); }

function nowLocalStr() {
  const d = new Date();
  return `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}T${pad(d.getHours())}:${pad(d.getMinutes())}`;
}

// 將本地 datetime-local 值，依經度校正後，輸出成 yyyyMMddHH
function toQimenDatetime(localStr, longitude) {
  const d = new Date(localStr);
  const offsetMinutes = (longitude - 120) * 4;
  const corrected = new Date(d.getTime() + offsetMinutes * 60 * 1000);
  return `${corrected.getFullYear()}${pad(corrected.getMonth()+1)}${pad(corrected.getDate())}${pad(corrected.getHours())}`;
}

// ============================================================
// 排盤主流程
// ============================================================
function paipan() {
  const timeStr = document.getElementById('qTime').value;
  const longitude = parseFloat(document.getElementById('qLongitude').value) || 121.31;
  if (!timeStr) { alert('請選擇時間'); return; }

  const datetime = toQimenDatetime(timeStr, longitude);
  let chart, obj, patterns;
  try {
    chart = Qimen.generateChartByDatetime(datetime, { 定局法: '符頭' });
    obj = Qimen.chartToObject(chart);
    patterns = Qimen.detectPatterns(obj);
  } catch (e) {
    document.getElementById('panInfo').innerHTML = `<div style="color:#e07b7b">排盤錯誤：${e.message}</div>`;
    document.getElementById('palaceGrid').innerHTML = '';
    document.getElementById('keyingList').innerHTML = '';
    return;
  }
  renderInfo(obj, datetime, longitude);
  renderGrid(obj);
  renderKeying(patterns);
}

// ============================================================
// 渲染盤面資訊
// ============================================================
function renderInfo(obj, datetime, longitude) {
  const dun = obj.陰陽 === '陽' ? '陽遁' : '陰遁';
  document.getElementById('panInfo').innerHTML = `
    <div>起局時刻<span>${datetime}</span></div>
    <div>經度校正<span>${longitude}°</span></div>
    <div>節氣<span>${obj.節氣 || '—'}</span></div>
    <div>三元<span>${obj.三元 || '—'}</span></div>
    <div>局數<span>${dun} ${obj.局數 || '—'} 局</span></div>
    <div>四柱<span>${obj.年柱} ${obj.月柱} ${obj.日柱} ${obj.時柱}</span></div>
    <div>旬首<span>${obj.旬首 || '—'}</span></div>
    <div>符首<span>${obj.符首 || '—'}</span></div>
    <div>值符<span>${obj.值符 || '—'}</span></div>
    <div>值使<span>${obj.值使 || '—'}</span></div>
  `;
}

// ============================================================
// 渲染九宮格
// ============================================================
function renderGrid(obj) {
  const grid = document.getElementById('palaceGrid');
  const di = obj.地盤 || [];
  const tian = obj.天盤 || [];
  const men = obj.天門 || [];
  const xing = obj.九星 || [];
  const shen = obj.八神 || [];

  grid.innerHTML = GONG_LAYOUT.map(g => {
    return `
      <div class="palace">
        <div class="gong">${g.luoshu}</div>
        <div class="name">${g.name} · ${g.dir}</div>
        <div class="row shen">${shen[g.idx] || '—'}</div>
        <div class="row xing">${xing[g.idx] || '—'}</div>
        <div class="row men">${men[g.idx] || '—'}</div>
        <div class="stack">
          <span class="gan-top">${tian[g.idx] || '　'}</span>
          <span class="gan-bot">${di[g.idx] || '　'}</span>
        </div>
      </div>
    `;
  }).join('');
}

// ============================================================
// 渲染十干克應
// ============================================================
function renderKeying(patterns) {
  const el = document.getElementById('keyingList');
  if (!patterns || !patterns.length) {
    el.innerHTML = '<div class="loading">（無格局資料）</div>';
    return;
  }
  // 只取十干克應
  const keying = patterns.filter(p => p.類 === '十干克應');
  if (!keying.length) {
    el.innerHTML = '<div class="loading">（本盤無十干克應資料）</div>';
    return;
  }
  el.innerHTML = keying.map(p => {
    const ji = p.吉凶 === '吉' ? '吉' : (p.吉凶 === '凶' ? '凶' : '');
    return `
      <div class="keying-item">
        <span class="gong">${p.宮 || ''}</span>
        <span class="ge">${p.格 || ''}</span>
        ${ji ? `<span class="ji ${ji}">${ji}</span>` : ''}
        <span class="duan">${p.斷語 || p.細節 || ''}</span>
      </div>
    `;
  }).join('');
}

// ============================================================
// 初始化
// ============================================================
document.addEventListener('DOMContentLoaded', () => {
  document.getElementById('qTime').value = nowLocalStr();
  document.getElementById('btnPaipan').addEventListener('click', paipan);
  document.getElementById('btnNow').addEventListener('click', () => {
    document.getElementById('qTime').value = nowLocalStr();
    paipan();
  });
  paipan();
});
</script>
</body>
</html>
