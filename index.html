<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>奇門遁甲排盤</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    background: #0d0f14;
    color: #e8e3d8;
    font-family: "Noto Serif TC", "Songti TC", "PingFang TC", "Microsoft JhengHei", serif;
    line-height: 1.7;
    padding: 20px;
  }
  .container { max-width: 1300px; margin: 0 auto; }
  h1 {
    text-align: center;
    color: #c9a961;
    font-size: 28px;
    letter-spacing: 4px;
    margin-bottom: 6px;
  }
  .sub { text-align: center; color: #9a958a; font-size: 13px; margin-bottom: 28px; }

  .toolbar {
    display: flex;
    flex-wrap: wrap;
    gap: 14px;
    align-items: flex-end;
    padding: 20px;
    background: #151922;
    border: 1px solid #2a3142;
    border-radius: 10px;
    margin-bottom: 24px;
  }
  .field label { display: block; font-size: 12px; color: #9a958a; margin-bottom: 4px; }
  .field input {
    background: #1c2230;
    border: 1px solid #2a3142;
    color: #e8e3d8;
    padding: 8px 12px;
    border-radius: 6px;
    font-family: inherit;
    font-size: 14px;
  }
  .btn {
    background: linear-gradient(180deg, #c9a961, #8a7440);
    color: #1a1408;
    border: none;
    padding: 9px 24px;
    border-radius: 6px;
    font-family: inherit;
    font-size: 14px;
    font-weight: 700;
    cursor: pointer;
    letter-spacing: 2px;
  }
  .btn:hover { filter: brightness(1.1); }
  .btn.ghost { background: transparent; border: 1px solid #8a7440; color: #c9a961; font-weight: 400; }

  .region-bar {
    display: flex;
    flex-wrap: wrap;
    gap: 10px;
    margin-top: 12px;
    padding-top: 14px;
    border-top: 1px solid #2a3142;
    width: 100%;
  }
  .region-btn {
    background: #1c2230;
    border: 1px solid #2a3142;
    color: #9a958a;
    padding: 8px 22px;
    border-radius: 6px;
    font-family: inherit;
    font-size: 14px;
    cursor: pointer;
    letter-spacing: 2px;
    transition: .2s;
  }
  .region-btn:hover { border-color: #8a7440; color: #c9a961; }
  .region-btn.active {
    background: linear-gradient(180deg, #c9a961, #8a7440);
    border-color: #c9a961;
    color: #1a1408;
    font-weight: 700;
  }
  .region-label {
    font-size: 12px;
    color: #9a958a;
    align-self: center;
    margin-right: 8px;
    letter-spacing: 1px;
  }

  .info {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(150px, 1fr));
    gap: 10px 24px;
    padding: 16px 20px;
    background: #151922;
    border: 1px solid #2a3142;
    border-radius: 8px;
    margin-bottom: 24px;
    font-size: 14px;
  }
  .info span { color: #c9a961; font-weight: 600; margin-left: 4px; }

  /* ===== 九宮格 ===== */
  .grid {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 8px;
    margin-bottom: 24px;
  }
  .palace {
    background: #151922;
    border: 1px solid #2a3142;
    border-radius: 8px;
    padding: 12px 14px 14px;
    display: flex;
    flex-direction: column;
    min-height: 240px;
    position: relative;
  }
  .palace-header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    font-size: 12px;
    color: #8a7440;
    margin-bottom: 8px;
    padding-bottom: 6px;
    border-bottom: 1px solid #2a3142;
  }
  .palace-header .luoshu { color: #5a6378; }

  .palace-body {
    display: flex;
    justify-content: space-between;
    align-items: flex-start;
    margin-bottom: 10px;
    padding: 4px 0;
    gap: 8px;
  }
  .palace-left {
    display: flex;
    flex-direction: column;
    gap: 4px;
    flex: 1;
  }
  .palace-left .shen { color: #b98bd8; font-size: 14px; }
  .palace-left .xing { color: #6fb3d8; font-size: 14px; }
  .palace-left .men  { color: #d8b26f; font-size: 14px; }
  .palace-right {
    display: flex;
    flex-direction: column;
    align-items: flex-end;
    gap: 4px;
    min-width: 50px;
    position: relative;
  }
  .palace-right .gan-tian { color: #e07b7b; font-size: 16px; font-weight: 700; }
  .palace-right .gan-di   { color: #7be0a8; font-size: 14px; }

  /* 馬星標記（紫色） */
  .ma-star {
    position: absolute;
    top: -4px;
    right: -4px;
    background: #d040d0;
    color: #fff;
    font-size: 12px;
    font-weight: 700;
    padding: 1px 8px;
    border-radius: 3px;
    letter-spacing: 1px;
    z-index: 2;
  }

  /* 空亡標記（綠色圓圈） */
  .kong-mark {
    display: inline-block;
    color: #7be0a8;
    font-size: 16px;
    margin-left: 4px;
    vertical-align: middle;
  }

  /* 空亡宮位淡化 */
  .palace.kong .palace-body { opacity: 0.55; }

  .palace-keying {
    border-top: 1px dashed #2a3142;
    padding-top: 8px;
    font-size: 12.5px;
    color: #c8c3b8;
    line-height: 1.6;
    flex: 1;
  }
  .palace-keying .kh {
    color: #c9a961;
    font-weight: 700;
    margin-right: 4px;
  }
  .palace-keying .ji {
    display: inline-block;
    font-size: 11px;
    padding: 0 6px;
    border-radius: 8px;
    margin-left: 4px;
  }
  .palace-keying .ji.吉 { background: rgba(76,175,80,.2); color: #7be0a8; }
  .palace-keying .ji.凶 { background: rgba(244,67,54,.2); color: #e07b7b; }
  .palace-keying .empty { color: #5a6378; }

  .notice {
    padding: 12px 16px;
    background: rgba(122,31,31,.15);
    border-left: 3px solid #7a1f1f;
    border-radius: 0 6px 6px 0;
    font-size: 13px;
    color: #9a958a;
    margin-bottom: 24px;
  }

  footer { text-align: center; color: #5a6378; font-size: 12px; padding: 40px 0 20px; }

  @media (max-width: 900px) {
    .grid { grid-template-columns: 1fr; }
    .palace { min-height: auto; }
  }
</style>
</head>
<body>
<div class="container">
  <h1>奇門遁甲排盤</h1>
  <div class="sub">拆補法 · 真太陽時校正 · 十干克應 · 馬星 · 旬空</div>

  <div class="toolbar">
    <div class="field">
      <label>起局時間（北京時間）</label>
      <input type="datetime-local" id="qTime">
    </div>
    <button class="btn" id="btnPaipan">起 局</button>
    <button class="btn ghost" id="btnNow">用現在時間</button>

    <div class="region-bar">
      <span class="region-label">真太陽時地區：</span>
      <button class="region-btn active" data-region="台灣">台灣</button>
      <button class="region-btn" data-region="香港">香港</button>
      <button class="region-btn" data-region="北京">北京</button>
      <button class="region-btn" data-region="無">不校正</button>
    </div>
  </div>

  <div class="info" id="panInfo"></div>
  <div class="grid" id="palaceGrid"></div>

  <div class="notice" id="noticeBar"></div>

  <footer>qimen-dunjia v3.1.0 · 符頭法 · 資料僅供參考</footer>
</div>

<script src="qimen.standalone.min.js"></script>
<script>
// ============================================================
// 地區設定
// ============================================================
const REGIONS = {
  '台灣': { 經度: 121.31, 校正分鐘: 65.24 },
  '香港': { 經度: 113.33, 校正分鐘: 33.32 },
  '北京': { 經度: 116.46, 校正分鐘: 45.84 },
  '無':   { 經度: 120,    校正分鐘: 0 }
};

let currentRegion = '台灣';

// ============================================================
// 九宮排列（依洛書方位）
// ============================================================
const GONG_LAYOUT = [
  { idx: 0, luoshu: 4, name: '巽宮', dir: '東南', zhi: ['辰','巳'] },
  { idx: 1, luoshu: 9, name: '離宮', dir: '南',   zhi: ['午'] },
  { idx: 2, luoshu: 2, name: '坤宮', dir: '西南', zhi: ['未','申'] },
  { idx: 3, luoshu: 3, name: '震宮', dir: '東',   zhi: ['卯'] },
  { idx: 4, luoshu: 5, name: '中宮', dir: '中',   zhi: [] },
  { idx: 5, luoshu: 7, name: '兌宮', dir: '西',   zhi: ['酉'] },
  { idx: 6, luoshu: 8, name: '艮宮', dir: '東北', zhi: ['丑','寅'] },
  { idx: 7, luoshu: 1, name: '坎宮', dir: '北',   zhi: ['子'] },
  { idx: 8, luoshu: 6, name: '乾宮', dir: '西北', zhi: ['戌','亥'] }
];

const GONG_NAME_MAP = {
  '巽': 0, '離': 1, '坤': 2,
  '震': 3, '中': 4, '兌': 5,
  '艮': 6, '坎': 7, '乾': 8
};

// ============================================================
// 地支 / 旬空 工具
// ============================================================
const ZHI = ['子','丑','寅','卯','辰','巳','午','未','申','酉','戌','亥'];

// 各旬的旬首與空亡地支
// 甲子旬空戌亥、甲戌旬空申酉、甲申旬空午未、甲午旬空辰巳、甲辰旬空寅卯、甲寅旬空子丑
const XUN_KONG = {
  '甲子': ['戌','亥'],
  '甲戌': ['申','酉'],
  '甲申': ['午','未'],
  '甲午': ['辰','巳'],
  '甲辰': ['寅','卯'],
  '甲寅': ['子','丑']
};

// 根據時柱干支求旬首
function getXunShou(shiGan, shiZhi) {
  const ganIdx = '甲乙丙丁戊己庚辛壬癸'.indexOf(shiGan);
  const zhiIdx = ZHI.indexOf(shiZhi);
  if (ganIdx < 0 || zhiIdx < 0) return null;
  // 旬首 = 該旬第一個甲X
  // 時干在旬中的位置 = ganIdx（甲=0, 乙=1, ...）
  // 旬首地支 = (時支索引 - 時干索引 + 12) % 12
  const xunZhiIdx = (zhiIdx - ganIdx + 12) % 12;
  return '甲' + ZHI[xunZhiIdx];
}

// 根據時支求馬星落宮
function getMaGong(shiZhi) {
  // 申子辰馬在寅、寅午戌馬在申、巳酉丑馬在亥、亥卯未馬在巳
  const group1 = ['申','子','辰']; // 馬在寅
  const group2 = ['寅','午','戌']; // 馬在申
  const group3 = ['巳','酉','丑']; // 馬在亥
  const group4 = ['亥','卯','未']; // 馬在巳
  if (group1.includes(shiZhi)) return '寅';
  if (group2.includes(shiZhi)) return '申';
  if (group3.includes(shiZhi)) return '亥';
  if (group4.includes(shiZhi)) return '巳';
  return null;
}

// 判斷某宮是否含指定地支
function gongHasZhi(gong, zhi) {
  return gong.zhi.includes(zhi);
}

// ============================================================
// 工具
// ============================================================
function pad(n) { return String(n).padStart(2, '0'); }

function nowLocalStr() {
  const d = new Date();
  return `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}T${pad(d.getHours())}:${pad(d.getMinutes())}`;
}

function toQimenDatetime(localStr, regionName) {
  const r = REGIONS[regionName] || REGIONS['無'];
  const d = new Date(localStr);
  const corrected = new Date(d.getTime() + r.校正分鐘 * 60 * 1000);
  return {
    datetime: `${corrected.getFullYear()}${pad(corrected.getMonth()+1)}${pad(corrected.getDate())}${pad(corrected.getHours())}`,
    displayTime: corrected
  };
}

// ============================================================
// 排盤主流程
// ============================================================
function paipan() {
  const timeStr = document.getElementById('qTime').value;
  if (!timeStr) { alert('請選擇時間'); return; }

  const { datetime, displayTime } = toQimenDatetime(timeStr, currentRegion);
  let chart, obj, patterns;
  try {
    chart = Qimen.generateChartByDatetime(datetime, { 定局法: '符頭' });
    obj = Qimen.chartToObject(chart);
    patterns = Qimen.detectPatterns(obj);
  } catch (e) {
    document.getElementById('panInfo').innerHTML = `<div style="color:#e07b7b">排盤錯誤：${e.message}</div>`;
    document.getElementById('palaceGrid').innerHTML = '';
    return;
  }

  // 從四柱取時干支
  const shiZhu = obj.時柱 || '';
  const shiGan = shiZhu[0] || '';
  const shiZhi = shiZhu[1] || '';

  // 算馬星與旬空
  const maZhi = getMaGong(shiZhi);
  const xunShou = getXunShou(shiGan, shiZhi);
  const kongZhi = xunShou ? (XUN_KONG[xunShou] || []) : [];

  renderInfo(obj, datetime, displayTime, currentRegion, maZhi, xunShou, kongZhi);
  renderGrid(obj, patterns, maZhi, kongZhi);
}

// ============================================================
// 渲染盤面資訊
// ============================================================
function renderInfo(obj, datetime, displayTime, regionName, maZhi, xunShou, kongZhi) {
  const dun = obj.陰陽 === '陽' ? '陽遁' : '陰遁';
  const r = REGIONS[regionName];
  const timeStr = `${displayTime.getFullYear()}-${pad(displayTime.getMonth()+1)}-${pad(displayTime.getDate())} ${pad(displayTime.getHours())}:${pad(displayTime.getMinutes())}:${pad(displayTime.getSeconds())}`;
  document.getElementById('panInfo').innerHTML = `
    <div>地區<span>${regionName}</span></div>
    <div>經度<span>${r.經度}°</span></div>
    <div>真太陽時<span>${timeStr}</span></div>
    <div>節氣<span>${obj.節氣 || '—'}</span></div>
    <div>三元<span>${obj.三元 || '—'}</span></div>
    <div>局數<span>${dun} ${obj.局數 || '—'} 局</span></div>
    <div>四柱<span>${obj.年柱} ${obj.月柱} ${obj.日柱} ${obj.時柱}</span></div>
    <div>旬首<span>${xunShou || obj.旬首 || '—'}</span></div>
    <div>旬空<span>${kongZhi.join('、') || '—'}</span></div>
    <div>馬星<span>${maZhi || '—'}</span></div>
    <div>值符<span>${obj.值符 || '—'}</span></div>
    <div>值使<span>${obj.值使 || '—'}</span></div>
  `;

  const noticeEl = document.getElementById('noticeBar');
  let baseNotice = '';
  if (regionName === '無') {
    baseNotice = '⚠ 目前為「不校正」模式，直接以北京時間排盤。';
  } else {
    baseNotice = `⚠ ${regionName}真太陽時校正：經度 ${r.經度}° → 校正量約 +${r.校正分鐘.toFixed(2)} 分鐘（含 60 分鐘時區補償，對齊元亨利貞）。`;
  }
  noticeEl.innerHTML = baseNotice + `<br>🐎 馬星：${maZhi || '—'}（依時支推算） ｜ ⭕ 旬空：${kongZhi.join('、') || '—'}（依時柱旬首推算）`;
}

// ============================================================
// 渲染九宮格（含每宮十干克應 + 馬星 + 旬空）
// ============================================================
function renderGrid(obj, patterns, maZhi, kongZhi) {
  const grid = document.getElementById('palaceGrid');
  const di = obj.地盤 || [];
  const tian = obj.天盤 || [];
  const men = obj.天門 || [];
  const xing = obj.九星 || [];
  const shen = obj.八神 || [];

  const keyingList = (patterns || []).filter(p => p.類 === '十干克應');
  const keyingByGong = {};
  keyingList.forEach(k => {
    if (!keyingByGong[k.宮]) keyingByGong[k.宮] = [];
    keyingByGong[k.宮].push(k);
  });

  const GONG_CHAR = {
    0: '巽', 1: '離', 2: '坤',
    3: '震', 4: '中', 5: '兌',
    6: '艮', 7: '坎', 8: '乾'
  };

  grid.innerHTML = GONG_LAYOUT.map(g => {
    const gongChar = GONG_CHAR[g.idx];
    const tg = tian[g.idx] || '';
    const dg = di[g.idx] || '';
    const combo = tg && dg ? `${tg}加${dg}` : '';

    // 判斷本宮是否有馬星
    const hasMa = maZhi && gongHasZhi(g, maZhi);
    // 判斷本宮是否有旬空（任何一個空亡地支落在本宮）
    const hasKong = kongZhi.some(kz => gongHasZhi(g, kz));

    // 十干克應（中宮跳過）
    let keyingHTML = '';
    if (gongChar !== '中') {
      const items = keyingByGong[gongChar] || [];
      if (items.length > 0) {
        keyingHTML = items.map(k => {
          const ji = k.吉凶 === '吉' ? '吉' : (k.吉凶 === '凶' ? '凶' : '');
          const geText = k.格 ? `為${k.格}，` : '';
          return `<div>
            <span class="kh">${combo || k.格}：</span>${geText}${k.斷語 || k.細節 || ''}
            ${ji ? `<span class="ji ${ji}">${ji}</span>` : ''}
          </div>`;
        }).join('');
      } else if (combo) {
        keyingHTML = `<div><span class="kh">${combo}：</span><span class="empty">—</span></div>`;
      } else {
        keyingHTML = `<div class="empty">（無克應）</div>`;
      }
    } else {
      keyingHTML = `<div class="empty">（中宮寄坤，不列克應）</div>`;
    }

    // 馬星標記
    const maHTML = hasMa ? `<span class="ma-star">馬</span>` : '';
    // 空亡標記（放在洛書數旁）
    const kongHTML = hasKong ? `<span class="kong-mark">○</span>` : '';

    return `
      <div class="palace ${hasKong ? 'kong' : ''}">
        ${maHTML}
        <div class="palace-header">
          <span>${g.name} · ${g.dir} ${kongHTML}</span>
          <span class="luoshu">${g.luoshu}</span>
        </div>
        <div class="palace-body">
          <div class="palace-left">
            <div class="shen">${shen[g.idx] || '—'}</div>
            <div class="xing">${xing[g.idx] || '—'}</div>
            <div class="men">${men[g.idx] || '—'}</div>
          </div>
          <div class="palace-right">
            <div class="gan-tian">${tg || '　'}</div>
            <div class="gan-di">${dg || '　'}</div>
          </div>
        </div>
        <div class="palace-keying">${keyingHTML}</div>
      </div>
    `;
  }).join('');
}

// ============================================================
// 初始化
// ============================================================
document.addEventListener('DOMContentLoaded', () => {
  document.getElementById('qTime').value = nowLocalStr();
  document.getElementById('btnPaipan').addEventListener('click', paipan);
  document.getElementById('btnNow').addEventListener('click', () => {
    document.getElementById('qTime').value = nowLocalStr();
    paipan();
  });

  document.querySelectorAll('.region-btn').forEach(btn => {
    btn.addEventListener('click', () => {
      document.querySelectorAll('.region-btn').forEach(b => b.classList.remove('active'));
      btn.classList.add('active');
      currentRegion = btn.dataset.region;
      paipan();
    });
  });

  paipan();
});
</script>
</body>
</html>
