<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>奇門遁甲排盤</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    background: #0d0f14;
    color: #e8e3d8;
    font-family: "Noto Serif TC", "Songti TC", "PingFang TC", "Microsoft JhengHei", serif;
    line-height: 1.7;
    padding: 20px;
  }
  .container { max-width: 1100px; margin: 0 auto; }
  h1 {
    text-align: center;
    color: #c9a961;
    font-size: 28px;
    letter-spacing: 4px;
    margin-bottom: 6px;
  }
  .sub { text-align: center; color: #9a958a; font-size: 13px; margin-bottom: 28px; }

  .toolbar {
    display: flex;
    flex-wrap: wrap;
    gap: 14px;
    align-items: flex-end;
    padding: 20px;
    background: #151922;
    border: 1px solid #2a3142;
    border-radius: 10px;
    margin-bottom: 24px;
  }
  .field label { display: block; font-size: 12px; color: #9a958a; margin-bottom: 4px; }
  .field input {
    background: #1c2230;
    border: 1px solid #2a3142;
    color: #e8e3d8;
    padding: 8px 12px;
    border-radius: 6px;
    font-family: inherit;
    font-size: 14px;
  }
  .btn {
    background: linear-gradient(180deg, #c9a961, #8a7440);
    color: #1a1408;
    border: none;
    padding: 9px 24px;
    border-radius: 6px;
    font-family: inherit;
    font-size: 14px;
    font-weight: 700;
    cursor: pointer;
    letter-spacing: 2px;
  }
  .btn:hover { filter: brightness(1.1); }
  .btn.ghost { background: transparent; border: 1px solid #8a7440; color: #c9a961; font-weight: 400; }

  .region-bar {
    display: flex;
    flex-wrap: wrap;
    gap: 10px;
    margin-top: 12px;
    padding-top: 14px;
    border-top: 1px solid #2a3142;
    width: 100%;
  }
  .region-btn {
    background: #1c2230;
    border: 1px solid #2a3142;
    color: #9a958a;
    padding: 8px 22px;
    border-radius: 6px;
    font-family: inherit;
    font-size: 14px;
    cursor: pointer;
    letter-spacing: 2px;
    transition: .2s;
  }
  .region-btn:hover { border-color: #8a7440; color: #c9a961; }
  .region-btn.active {
    background: linear-gradient(180deg, #c9a961, #8a7440);
    border-color: #c9a961;
    color: #1a1408;
    font-weight: 700;
  }
  .region-label {
    font-size: 12px;
    color: #9a958a;
    align-self: center;
    margin-right: 8px;
    letter-spacing: 1px;
  }

  .info {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(150px, 1fr));
    gap: 10px 24px;
    padding: 16px 20px;
    background: #151922;
    border: 1px solid #2a3142;
    border-radius: 8px;
    margin-bottom: 24px;
    font-size: 14px;
  }
  .info span { color: #c9a961; font-weight: 600; margin-left: 4px; }

  .grid {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 1px;
    background: #2a3142;
    border: 1px solid #2a3142;
    border-radius: 8px;
    overflow: hidden;
    margin-bottom: 24px;
  }
  .palace {
    background: #151922;
    padding: 12px 12px 10px;
    min-height: 150px;
    position: relative;
  }
  .palace .gong { position: absolute; top: 8px; right: 10px; font-size: 11px; color: #5a6378; }
  .palace .name { font-size: 12px; color: #8a7440; margin-bottom: 6px; }
  .palace .row { font-size: 13px; margin: 3px 0; letter-spacing: 1px; }
  .palace .shen { color: #b98bd8; }
  .palace .xing { color: #6fb3d8; }
  .palace .men { color: #d8b26f; }
  .palace .gan-top { color: #e07b7b; font-size: 16px; font-weight: 700; }
  .palace .gan-bot { color: #7be0a8; font-size: 14px; }
  .palace .stack { display: flex; justify-content: space-between; margin-top: 8px; }

  .notice {
    padding: 12px 16px;
    background: rgba(122,31,31,.15);
    border-left: 3px solid #7a1f1f;
    border-radius: 0 6px 6px 0;
    font-size: 13px;
    color: #9a958a;
    margin-bottom: 24px;
  }

  .section-title {
    color: #c9a961;
    font-size: 18px;
    margin: 32px 0 12px;
    letter-spacing: 2px;
    border-bottom: 1px solid #2a3142;
    padding-bottom: 8px;
  }

  /* ===== 十干克應 ===== */
  .keying { font-size: 14px; }
  .keying-gong-title {
    color: #8a7440;
    font-size: 14px;
    margin: 20px 0 8px;
    padding-bottom: 4px;
    border-bottom: 1px dashed #2a3142;
  }
  .keying-item {
    padding: 6px 14px;
    line-height: 1.9;
  }
  .keying-item .ganhe {
    color: #c9a961;
    font-weight: 700;
    margin-right: 6px;
  }
  .keying-item .gexing {
    color: #b98bd8;
    margin-right: 4px;
  }
  .keying-item .duan {
    color: #c8c3b8;
  }
  .keying-item .ji {
    display: inline-block;
    font-size: 12px;
    padding: 0 8px;
    border-radius: 10px;
    margin-left: 6px;
  }
  .keying-item .ji.吉 { background: rgba(76,175,80,.2); color: #7be0a8; }
  .keying-item .ji.凶 { background: rgba(244,67,54,.2); color: #e07b7b; }

  .loading { text-align: center; color: #5a6378; padding: 20px; }
  footer { text-align: center; color: #5a6378; font-size: 12px; padding: 40px 0 20px; }
</style>
</head>
<body>
<div class="container">
  <h1>奇門遁甲排盤</h1>
  <div class="sub">拆補法 · 真太陽時校正 · 十干克應</div>

  <div class="toolbar">
    <div class="field">
      <label>起局時間（北京時間）</label>
      <input type="datetime-local" id="qTime">
    </div>
    <button class="btn" id="btnPaipan">起 局</button>
    <button class="btn ghost" id="btnNow">用現在時間</button>

    <div class="region-bar">
      <span class="region-label">真太陽時地區：</span>
      <button class="region-btn active" data-region="台灣">台灣</button>
      <button class="region-btn" data-region="香港">香港</button>
      <button class="region-btn" data-region="北京">北京</button>
      <button class="region-btn" data-region="無">不校正</button>
    </div>
  </div>

  <div class="info" id="panInfo"></div>
  <div class="grid" id="palaceGrid"></div>

  <div class="notice" id="noticeBar"></div>

  <div class="section-title">十干克應</div>
  <div class="keying" id="keyingList"></div>

  <footer>qimen-dunjia v3.1.0 · 符頭法 · 資料僅供參考</footer>
</div>

<script src="qimen.standalone.min.js"></script>
<script>
// ============================================================
// 地區設定（校正量 = 經度校正 + 60 分鐘時區補償，對齊元亨利貞）
// ============================================================
const REGIONS = {
  '台灣': { 經度: 121.31, 校正分鐘: 65.24 },
  '香港': { 經度: 113.33, 校正分鐘: 33.32 },
  '北京': { 經度: 116.46, 校正分鐘: 45.84 },
  '無':   { 經度: 120,    校正分鐘: 0 }
};

let currentRegion = '台灣';

// ============================================================
// 九宮排列
// ============================================================
const GONG_LAYOUT = [
  { idx: 0, luoshu: 4, name: '巽宮', dir: '東南' },
  { idx: 1, luoshu: 9, name: '離宮', dir: '南' },
  { idx: 2, luoshu: 2, name: '坤宮', dir: '西南' },
  { idx: 3, luoshu: 3, name: '震宮', dir: '東' },
  { idx: 4, luoshu: 5, name: '中宮', dir: '中' },
  { idx: 5, luoshu: 7, name: '兌宮', dir: '西' },
  { idx: 6, luoshu: 8, name: '艮宮', dir: '東北' },
  { idx: 7, luoshu: 1, name: '坎宮', dir: '北' },
  { idx: 8, luoshu: 6, name: '乾宮', dir: '西北' }
];

// 宮名（單字）→ 九宮陣列索引
const GONG_NAME_MAP = {
  '巽': 0, '離': 1, '坤': 2,
  '震': 3, '中': 4, '兌': 5,
  '艮': 6, '坎': 7, '乾': 8
};

// 十干克應顯示順序（依元亨利貞慣例：坎艮震巽中離坤兌乾）
const KEYING_ORDER = [
  { gongChar: '坎', luoshu: 1, name: '坎宮' },
  { gongChar: '艮', luoshu: 8, name: '艮宮' },
  { gongChar: '震', luoshu: 3, name: '震宮' },
  { gongChar: '巽', luoshu: 4, name: '巽宮' },
  { gongChar: '中', luoshu: 5, name: '中宮' },
  { gongChar: '離', luoshu: 9, name: '離宮' },
  { gongChar: '坤', luoshu: 2, name: '坤宮' },
  { gongChar: '兌', luoshu: 7, name: '兌宮' },
  { gongChar: '乾', luoshu: 6, name: '乾宮' }
];

// ============================================================
// 工具
// ============================================================
function pad(n) { return String(n).padStart(2, '0'); }

function nowLocalStr() {
  const d = new Date();
  return `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}T${pad(d.getHours())}:${pad(d.getMinutes())}`;
}

function toQimenDatetime(localStr, regionName) {
  const r = REGIONS[regionName] || REGIONS['無'];
  const d = new Date(localStr);
  const corrected = new Date(d.getTime() + r.校正分鐘 * 60 * 1000);
  return {
    datetime: `${corrected.getFullYear()}${pad(corrected.getMonth()+1)}${pad(corrected.getDate())}${pad(corrected.getHours())}`,
    displayTime: corrected
  };
}

// ============================================================
// 排盤主流程
// ============================================================
function paipan() {
  const timeStr = document.getElementById('qTime').value;
  if (!timeStr) { alert('請選擇時間'); return; }

  const { datetime, displayTime } = toQimenDatetime(timeStr, currentRegion);
  let chart, obj, patterns;
  try {
    chart = Qimen.generateChartByDatetime(datetime, { 定局法: '符頭' });
    obj = Qimen.chartToObject(chart);
    patterns = Qimen.detectPatterns(obj);
  } catch (e) {
    document.getElementById('panInfo').innerHTML = `<div style="color:#e07b7b">排盤錯誤：${e.message}</div>`;
    document.getElementById('palaceGrid').innerHTML = '';
    document.getElementById('keyingList').innerHTML = '';
    return;
  }
  renderInfo(obj, datetime, displayTime, currentRegion);
  renderGrid(obj);
  renderKeying(patterns, obj);
}

// ============================================================
// 渲染盤面資訊
// ============================================================
function renderInfo(obj, datetime, displayTime, regionName) {
  const dun = obj.陰陽 === '陽' ? '陽遁' : '陰遁';
  const r = REGIONS[regionName];
  const timeStr = `${displayTime.getFullYear()}-${pad(displayTime.getMonth()+1)}-${pad(displayTime.getDate())} ${pad(displayTime.getHours())}:${pad(displayTime.getMinutes())}:${pad(displayTime.getSeconds())}`;
  document.getElementById('panInfo').innerHTML = `
    <div>地區<span>${regionName}</span></div>
    <div>經度<span>${r.經度}°</span></div>
    <div>真太陽時<span>${timeStr}</span></div>
    <div>節氣<span>${obj.節氣 || '—'}</span></div>
    <div>三元<span>${obj.三元 || '—'}</span></div>
    <div>局數<span>${dun} ${obj.局數 || '—'} 局</span></div>
    <div>四柱<span>${obj.年柱} ${obj.月柱} ${obj.日柱} ${obj.時柱}</span></div>
    <div>旬首<span>${obj.旬首 || '—'}</span></div>
    <div>符首<span>${obj.符首 || '—'}</span></div>
    <div>值符<span>${obj.值符 || '—'}</span></div>
    <div>值使<span>${obj.值使 || '—'}</span></div>
  `;

  const noticeEl = document.getElementById('noticeBar');
  if (regionName === '無') {
    noticeEl.innerHTML = '⚠ 目前為「不校正」模式，直接以北京時間排盤。';
  } else {
    noticeEl.innerHTML = `⚠ ${regionName}真太陽時校正：經度 ${r.經度}° → 校正量約 +${r.校正分鐘.toFixed(2)} 分鐘（含 60 分鐘時區補償，對齊元亨利貞）。`;
  }
}

// ============================================================
// 渲染九宮格
// ============================================================
function renderGrid(obj) {
  const grid = document.getElementById('palaceGrid');
  const di = obj.地盤 || [];
  const tian = obj.天盤 || [];
  const men = obj.天門 || [];
  const xing = obj.九星 || [];
  const shen = obj.八神 || [];

  grid.innerHTML = GONG_LAYOUT.map(g => {
    return `
      <div class="palace">
        <div class="gong">${g.luoshu}</div>
        <div class="name">${g.name} · ${g.dir}</div>
        <div class="row shen">${shen[g.idx] || '—'}</div>
        <div class="row xing">${xing[g.idx] || '—'}</div>
        <div class="row men">${men[g.idx] || '—'}</div>
        <div class="stack">
          <span class="gan-top">${tian[g.idx] || '　'}</span>
          <span class="gan-bot">${di[g.idx] || '　'}</span>
        </div>
      </div>
    `;
  }).join('');
}

// ============================================================
// 渲染十干克應
// 格式對齊元亨利貞：庚加戊：為太白天乙伏宮，百事不可謀為，凶。
// 說明：本引擎無「暗干」資料，故每宮僅列「天盤干加地盤干」一條。
// ============================================================
function renderKeying(patterns, obj) {
  const el = document.getElementById('keyingList');
  if (!patterns || !patterns.length) {
    el.innerHTML = '<div class="loading">（無格局資料）</div>';
    return;
  }

  const keying = patterns.filter(p => p.類 === '十干克應');
  if (!keying.length) {
    el.innerHTML = '<div class="loading">（本盤無十干克應資料）</div>';
    return;
  }

  const keyingByGong = {};
  keying.forEach(k => {
    if (!keyingByGong[k.宮]) keyingByGong[k.宮] = [];
    keyingByGong[k.宮].push(k);
  });

  const tian = obj.天盤 || [];
  const di = obj.地盤 || [];

  let html = '';
  KEYING_ORDER.forEach(g => {
    const idx = GONG_NAME_MAP[g.gongChar];
    if (idx === undefined) return;

    const tg = tian[idx] || '';
    const dg = di[idx] || '';
    const combo = tg && dg ? `${tg}加${dg}` : '';

    const items = keyingByGong[g.gongChar] || [];
    if (items.length === 0 && !combo) return;

    html += `<div class="keying-gong-title">第${g.luoshu}宮（${g.name}）</div>`;

    if (items.length === 0) {
      if (combo) {
        html += `<div class="keying-item"><span class="ganhe">${combo}：</span><span class="duan">—</span></div>`;
      }
    } else {
      items.forEach(k => {
        const ji = k.吉凶 === '吉' ? '吉' : (k.吉凶 === '凶' ? '凶' : '');
        // 格式：庚加戊：為太白天乙伏宮，百事不可謀為，凶。
        // k.格 是格名（如「太白天乙伏宮」）
        // k.斷語 是斷語（如「百事不可謀為，凶。」）
        const geText = k.格 ? `為${k.格}，` : '';
        html += `
          <div class="keying-item">
            <span class="ganhe">${combo || k.格}：</span>
            <span class="gexing">${geText}</span>
            <span class="duan">${k.斷語 || k.細節 || ''}</span>
            ${ji ? `<span class="ji ${ji}">${ji}</span>` : ''}
          </div>
        `;
      });
    }
  });

  el.innerHTML = html || '<div class="loading">（無資料）</div>';
}

// ============================================================
// 初始化
// ============================================================
document.addEventListener('DOMContentLoaded', () => {
  document.getElementById('qTime').value = nowLocalStr();
  document.getElementById('btnPaipan').addEventListener('click', paipan);
  document.getElementById('btnNow').addEventListener('click', () => {
    document.getElementById('qTime').value = nowLocalStr();
    paipan();
  });

  document.querySelectorAll('.region-btn').forEach(btn => {
    btn.addEventListener('click', () => {
      document.querySelectorAll('.region-btn').forEach(b => b.classList.remove('active'));
      btn.classList.add('active');
      currentRegion = btn.dataset.region;
      paipan();
    });
  });

  paipan();
});
</script>
</body>
</html>
