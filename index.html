<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>奇門遁甲排盤</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    background: #0d0f14;
    color: #e8e3d8;
    font-family: "Noto Serif TC", "Songti TC", "PingFang TC", "Microsoft JhengHei", serif;
    line-height: 1.7;
    padding: 20px;
  }
  .container { max-width: 1300px; margin: 0 auto; }
  h1 {
    text-align: center;
    color: #c9a961;
    font-size: 28px;
    letter-spacing: 4px;
    margin-bottom: 6px;
  }
  .sub { text-align: center; color: #9a958a; font-size: 13px; margin-bottom: 28px; }

  .toolbar {
    display: flex;
    flex-wrap: wrap;
    gap: 14px;
    align-items: flex-end;
    padding: 20px;
    background: #151922;
    border: 1px solid #2a3142;
    border-radius: 10px;
    margin-bottom: 24px;
  }
  .field label { display: block; font-size: 12px; color: #9a958a; margin-bottom: 4px; }
  .field input {
    background: #1c2230;
    border: 1px solid #2a3142;
    color: #e8e3d8;
    padding: 8px 12px;
    border-radius: 6px;
    font-family: inherit;
    font-size: 14px;
  }
  .btn {
    background: linear-gradient(180deg, #c9a961, #8a7440);
    color: #1a1408;
    border: none;
    padding: 9px 24px;
    border-radius: 6px;
    font-family: inherit;
    font-size: 14px;
    font-weight: 700;
    cursor: pointer;
    letter-spacing: 2px;
  }
  .btn:hover { filter: brightness(1.1); }
  .btn.ghost { background: transparent; border: 1px solid #8a7440; color: #c9a961; font-weight: 400; }

  .region-bar {
    display: flex;
    flex-wrap: wrap;
    gap: 10px;
    margin-top: 12px;
    padding-top: 14px;
    border-top: 1px solid #2a3142;
    width: 100%;
  }
  .region-btn {
    background: #1c2230;
    border: 1px solid #2a3142;
    color: #9a958a;
    padding: 8px 22px;
    border-radius: 6px;
    font-family: inherit;
    font-size: 14px;
    cursor: pointer;
    letter-spacing: 2px;
    transition: .2s;
  }
  .region-btn:hover { border-color: #8a7440; color: #c9a961; }
  .region-btn.active {
    background: linear-gradient(180deg, #c9a961, #8a7440);
    border-color: #c9a961;
    color: #1a1408;
    font-weight: 700;
  }
  .region-label {
    font-size: 12px;
    color: #9a958a;
    align-self: center;
    margin-right: 8px;
    letter-spacing: 1px;
  }

  .info {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(150px, 1fr));
    gap: 10px 24px;
    padding: 16px 20px;
    background: #151922;
    border: 1px solid #2a3142;
    border-radius: 8px;
    margin-bottom: 24px;
    font-size: 14px;
  }
  .info span { color: #c9a961; font-weight: 600; margin-left: 4px; }

  .grid {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 8px;
    margin-bottom: 24px;
  }
  .palace {
    background: #151922;
    border: 1px solid #2a3142;
    border-radius: 8px;
    padding: 12px 14px 14px;
    display: flex;
    flex-direction: column;
    min-height: 260px;
    position: relative;
  }
  .palace-header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    font-size: 12px;
    color: #8a7440;
    margin-bottom: 8px;
    padding-bottom: 6px;
    border-bottom: 1px solid #2a3142;
  }
  .palace-header .luoshu { color: #5a6378; }

  .palace-body {
    display: flex;
    justify-content: space-between;
    align-items: flex-start;
    margin-bottom: 10px;
    padding: 4px 0;
    gap: 8px;
  }
  .palace-left {
    display: flex;
    flex-direction: column;
    gap: 4px;
    flex: 1;
  }
  .palace-left .shen { color: #b98bd8; font-size: 14px; }
  .palace-left .xing { color: #6fb3d8; font-size: 14px; }
  .palace-left .men  { color: #d8b26f; font-size: 14px; }
  .palace-right {
    display: flex;
    flex-direction: column;
    align-items: flex-end;
    gap: 2px;
    min-width: 50px;
  }
  .palace-right .gan-tian { color: #e07b7b; font-size: 16px; font-weight: 700; }
  .palace-right .gan-an   { color: #c9a961; font-size: 13px; font-style: italic; }
  .palace-right .gan-di   { color: #7be0a8; font-size: 14px; }

  .ma-star {
    position: absolute;
    top: 8px;
    right: 8px;
    background: #d040d0;
    color: #fff;
    font-size: 11px;
    font-weight: 700;
    padding: 1px 6px;
    border-radius: 3px;
    letter-spacing: 1px;
    z-index: 2;
  }

  .kong-mark {
    display: inline-block;
    color: #7be0a8;
    font-size: 14px;
    margin-left: 4px;
    vertical-align: middle;
    font-weight: 700;
  }

  .palace-keying {
    border-top: 1px dashed #2a3142;
    padding-top: 8px;
    font-size: 12.5px;
    color: #c8c3b8;
    line-height: 1.6;
    flex: 1;
  }
  .palace-keying .kh {
    color: #c9a961;
    font-weight: 700;
    margin-right: 4px;
  }
  .palace-keying .ji {
    display: inline-block;
    font-size: 11px;
    padding: 0 6px;
    border-radius: 8px;
    margin-left: 4px;
  }
  .palace-keying .ji.吉 { background: rgba(76,175,80,.2); color: #7be0a8; }
  .palace-keying .ji.凶 { background: rgba(244,67,54,.2); color: #e07b7b; }
  .palace-keying .empty { color: #5a6378; }

  .notice {
    padding: 12px 16px;
    background: rgba(122,31,31,.15);
    border-left: 3px solid #7a1f1f;
    border-radius: 0 6px 6px 0;
    font-size: 13px;
    color: #9a958a;
    margin-bottom: 24px;
  }

  footer { text-align: center; color: #5a6378; font-size: 12px; padding: 40px 0 20px; }

  @media (max-width: 900px) {
    .grid { grid-template-columns: 1fr; }
    .palace { min-height: auto; }
  }
</style>
</head>
<body>
<div class="container">
  <h1>奇門遁甲排盤</h1>
  <div class="sub">符頭法 · 真太陽時（台北） · 十干克應 · 馬星 · 旬空 · 暗干(實驗)</div>

  <div class="toolbar">
    <div class="field">
      <label>起局時間（北京時間）</label>
      <input type="datetime-local" id="qTime">
    </div>
    <button class="btn" id="btnPaipan">起 局</button>
    <button class="btn ghost" id="btnNow">用現在時間</button>

    <div class="region-bar">
      <span class="region-label">真太陽時地區：</span>
      <button class="region-btn active" data-region="台北">台北</button>
      <button class="region-btn" data-region="無">不校正</button>
    </div>
  </div>

  <div class="info" id="panInfo"></div>
  <div class="grid" id="palaceGrid"></div>

  <div class="notice" id="noticeBar"></div>

  <footer>qimen2.standalone · 符頭法 · 資料僅供參考</footer>
</div>

<script src="qimen2.standalone.min.js"></script>
<script>
// ============================================================
// 地區設定
// ============================================================
const REGIONS = {
  '台北': { 經度: 121.31, 時區: 8, 說明: '台北（UTC+8）' },
  '無':   { 經度: 120,    時區: 8, 說明: '不校正' }
};

let currentRegion = '台北';

// ============================================================
// 均時差計算
// ============================================================
function getEquationOfTime(date) {
  const start = new Date(date.getFullYear(), 0, 0);
  const dayOfYear = Math.floor((date - start) / 86400000);
  const B = 2 * Math.PI * (dayOfYear - 81) / 364;
  return 9.87 * Math.sin(2 * B) - 7.53 * Math.cos(B) - 1.5 * Math.sin(B);
}

function getRegionOffset(localDate, regionName) {
  if (regionName === '無') return 0;
  const r = REGIONS[regionName];
  const 經度校正 = (r.經度 - 120) * 4;
  const 均時差 = getEquationOfTime(localDate);
  return 經度校正 + 均時差;
}

// ============================================================
// 九宮排列
// ============================================================
const GONG_LAYOUT = [
  { idx: 0, luoshu: 4, name: '巽宮', dir: '東南', zhi: ['辰','巳'] },
  { idx: 1, luoshu: 9, name: '離宮', dir: '南',   zhi: ['午'] },
  { idx: 2, luoshu: 2, name: '坤宮', dir: '西南', zhi: ['未','申'] },
  { idx: 3, luoshu: 3, name: '震宮', dir: '東',   zhi: ['卯'] },
  { idx: 4, luoshu: 5, name: '中宮', dir: '中',   zhi: [] },
  { idx: 5, luoshu: 7, name: '兌宮', dir: '西',   zhi: ['酉'] },
  { idx: 6, luoshu: 8, name: '艮宮', dir: '東北', zhi: ['丑','寅'] },
  { idx: 7, luoshu: 1, name: '坎宮', dir: '北',   zhi: ['子'] },
  { idx: 8, luoshu: 6, name: '乾宮', dir: '西北', zhi: ['戌','亥'] }
];

// 洛書數 → 陣列索引
const LUOSHU_TO_IDX = {1:7, 2:2, 3:3, 4:0, 5:4, 6:8, 7:5, 8:6, 9:1};

// ============================================================
// 地支 / 旬空 工具
// ============================================================
const ZHI = ['子','丑','寅','卯','辰','巳','午','未','申','酉','戌','亥'];

const XUN_KONG = {
  '甲子': ['戌','亥'],
  '甲戌': ['申','酉'],
  '甲申': ['午','未'],
  '甲午': ['辰','巳'],
  '甲辰': ['寅','卯'],
  '甲寅': ['子','丑']
};

function getXunShou(shiGan, shiZhi) {
  const ganIdx = '甲乙丙丁戊己庚辛壬癸'.indexOf(shiGan);
  const zhiIdx = ZHI.indexOf(shiZhi);
  if (ganIdx < 0 || zhiIdx < 0) return null;
  const xunZhiIdx = (zhiIdx - ganIdx + 12) % 12;
  return '甲' + ZHI[xunZhiIdx];
}

function getMaZhi(shiZhi) {
  const g1 = ['申','子','辰'];
  const g2 = ['寅','午','戌'];
  const g3 = ['巳','酉','丑'];
  const g4 = ['亥','卯','未'];
  if (g1.includes(shiZhi)) return '寅';
  if (g2.includes(shiZhi)) return '申';
  if (g3.includes(shiZhi)) return '亥';
  if (g4.includes(shiZhi)) return '巳';
  return null;
}

function gongHasZhi(gong, zhi) {
  return gong.zhi.includes(zhi);
}

// ============================================================
// 暗干計算（實驗版：順飛）
// 規則：從值符落宮起，按洛書順飛（1→2→3...→9，中宮跳過），
//       天干順序用「戊己庚辛壬癸丁丙乙」（跳過甲）
// ============================================================
function computeAnGan(obj) {
  // 找值符落宮（obj.值符落宮 是宮名字，如「坤」）
  const zhiFuGongChar = obj.值符落宮 || '';
  const GONG_CHAR_TO_LUOSHU = {
    '坎': 1, '坤': 2, '震': 3, '巽': 4, '中': 5,
    '乾': 6, '兌': 7, '艮': 8, '離': 9
  };
  const startLuoshu = GONG_CHAR_TO_LUOSHU[zhiFuGongChar];
  if (!startLuoshu) return {};

  // 九干顺序（跳過甲）
  const NINE_GAN = ['戊','己','庚','辛','壬','癸','丁','丙','乙'];

  // 順飛：洛書數 1→2→...→9（中宮跳過），從值符宮起
  const anGanMap = {}; // luoshu → 干
  let ganIdx = 0;
  // 從 startLuoshu 開始，依序走 1..9，遇到中宮5跳過
  for (let i = 0; i < 9; i++) {
    const luoshu = ((startLuoshu - 1 + i) % 9) + 1;
    if (luoshu === 5) continue; // 跳過中宮
    if (ganIdx >= 9) break;
    anGanMap[luoshu] = NINE_GAN[ganIdx];
    ganIdx++;
  }
  return anGanMap;
}

// ============================================================
// 工具
// ============================================================
function pad(n) { return String(n).padStart(2, '0'); }

function nowLocalStr() {
  const d = new Date();
  return `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}T${pad(d.getHours())}:${pad(d.getMinutes())}`;
}

function toQimenDatetime(localStr, regionName) {
  const d = new Date(localStr);
  const offset = getRegionOffset(d, regionName);
  const corrected = new Date(d.getTime() + offset * 60 * 1000);
  return {
    datetime: `${corrected.getFullYear()}${pad(corrected.getMonth()+1)}${pad(corrected.getDate())}${pad(corrected.getHours())}`,
    displayTime: corrected,
    offset: offset
  };
}

// ============================================================
// 排盤主流程
// ============================================================
function paipan() {
  const timeStr = document.getElementById('qTime').value;
  if (!timeStr) { alert('請選擇時間'); return; }

  const { datetime, displayTime, offset } = toQimenDatetime(timeStr, currentRegion);
  let chart, obj, patterns;
  try {
    chart = Qimen.generateChartByDatetime(datetime, { 定局法: '符頭' });
    obj = Qimen.chartToObject(chart);
    patterns = Qimen.detectPatterns(obj);
  } catch (e) {
    document.getElementById('panInfo').innerHTML = `<div style="color:#e07b7b">排盤錯誤：${e.message}</div>`;
    document.getElementById('palaceGrid').innerHTML = '';
    return;
  }

  const shiZhu = obj.時柱 || '';
  const shiGan = shiZhu[0] || '';
  const shiZhi = shiZhu[1] || '';

  const maZhi = getMaZhi(shiZhi);
  const xunShou = getXunShou(shiGan, shiZhi);
  const kongZhi = xunShou ? (XUN_KONG[xunShou] || []) : [];
  const anGanMap = computeAnGan(obj);

  renderInfo(obj, datetime, displayTime, currentRegion, maZhi, xunShou, kongZhi, offset);
  renderGrid(obj, patterns, maZhi, kongZhi, anGanMap);
}

// ============================================================
// 渲染盤面資訊
// ============================================================
function renderInfo(obj, datetime, displayTime, regionName, maZhi, xunShou, kongZhi, offset) {
  const dun = obj.陰陽 === '陽' ? '陽遁' : '陰遁';
  const r = REGIONS[regionName];
  const timeStr = `${displayTime.getFullYear()}-${pad(displayTime.getMonth()+1)}-${pad(displayTime.getDate())} ${pad(displayTime.getHours())}:${pad(displayTime.getMinutes())}:${pad(displayTime.getSeconds())}`;
  document.getElementById('panInfo').innerHTML = `
    <div>地區<span>${regionName}</span></div>
    <div>經度<span>${r.經度}°</span></div>
    <div>真太陽時<span>${timeStr}</span></div>
    <div>節氣<span>${obj.節氣 || '—'}</span></div>
    <div>三元<span>${obj.三元 || '—'}</span></div>
    <div>局數<span>${dun} ${obj.局數 || '—'} 局</span></div>
    <div>四柱<span>${obj.年柱} ${obj.月柱} ${obj.日柱} ${obj.時柱}</span></div>
    <div>旬首<span>${xunShou || obj.旬首 || '—'}</span></div>
    <div>旬空<span>${kongZhi.join('、') || '—'}</span></div>
    <div>馬星<span>${maZhi || '—'}</span></div>
    <div>值符<span>${obj.值符 || '—'}</span></div>
    <div>值使<span>${obj.值使 || '—'}</span></div>
    <div>值符落宮<span>${obj.值符落宮 || '—'}</span></div>
  `;

  const noticeEl = document.getElementById('noticeBar');
  let baseNotice = '';
  if (regionName === '無') {
    baseNotice = '⚠ 目前為「不校正」模式，直接以北京時間排盤。';
  } else {
    const 經度校正 = (r.經度 - 120) * 4;
    const 均時差 = getEquationOfTime(displayTime);
    baseNotice = `⚠ ${regionName}真太陽時校正：經度 ${r.經度}° → 經度校正 ${經度校正.toFixed(2)} 分 + 均時差 ${均時差.toFixed(2)} 分 = 總校正 ${offset.toFixed(2)} 分。`;
  }
  noticeEl.innerHTML = baseNotice + `<br>🐎 馬星：${maZhi || '—'} ｜ ⭕ 旬空：${kongZhi.join('、') || '—'}<br>🔸 <b>暗干為實驗版（順飛）</b>，尚未驗證是否與元亨利貞一致。`;
}

// ============================================================
// 渲染九宮格
// ============================================================
function renderGrid(obj, patterns, maZhi, kongZhi, anGanMap) {
  const grid = document.getElementById('palaceGrid');
  const di = obj.地盤 || [];
  const tian = obj.天盤 || [];
  const men = obj.天門 || [];
  const xing = obj.九星 || [];
  const shen = obj.八神 || [];

  const keyingList = (patterns || []).filter(p => p.類 === '十干克應');
  const keyingByGong = {};
  keyingList.forEach(k => {
    if (!keyingByGong[k.宮]) keyingByGong[k.宮] = [];
    keyingByGong[k.宮].push(k);
  });

  const GONG_CHAR = {
    0: '巽', 1: '離', 2: '坤',
    3: '震', 4: '中', 5: '兌',
    6: '艮', 7: '坎', 8: '乾'
  };

  // 暗干 → 陣列索引
  const anGanByIdx = {};
  for (const luoshu in anGanMap) {
    const idx = LUOSHU_TO_IDX[luoshu];
    if (idx !== undefined) anGanByIdx[idx] = anGanMap[luoshu];
  }

  grid.innerHTML = GONG_LAYOUT.map(g => {
    const gongChar = GONG_CHAR[g.idx];
    const tg = tian[g.idx] || '';
    const dg = di[g.idx] || '';
    const ag = anGanByIdx[g.idx] || '';
    const combo = tg && dg ? `${tg}加${dg}` : '';
    const combo2 = ag && dg ? `${ag}加${dg}` : '';

    const hasMa = maZhi && gongHasZhi(g, maZhi);
    const hasKong = kongZhi.some(kz => gongHasZhi(g, kz));

    let keyingHTML = '';
    if (gongChar !== '中') {
      const items = keyingByGong[gongChar] || [];
      // 建立天盤干對應的克應
      const keyingByGan = {};
      items.forEach(k => {
        // 從 k.細節 中抓「天盤X加地盤Y」
        const m = (k.細節 || '').match(/天盤(\S)加地盤(\S)/);
        if (m) keyingByGan[m[1]] = k;
        else if (k.格) keyingByGan[k.格] = k;
      });

      const lines = [];
      // 第一條：主天盤干 + 地盤干
      if (tg && dg) {
        const k = keyingByGan[tg];
        if (k) {
          const ji = k.吉凶 === '吉' ? '吉' : (k.吉凶 === '凶' ? '凶' : '');
          const geText = k.格 ? `為${k.格}，` : '';
          lines.push(`<div><span class="kh">${tg}加${dg}：</span>${geText}${k.斷語 || ''}${ji ? `<span class="ji ${ji}">${ji}</span>` : ''}</div>`);
        } else {
          lines.push(`<div><span class="kh">${tg}加${dg}：</span><span class="empty">—</span></div>`);
        }
      }
      // 第二條：暗干 + 地盤干（實驗）
      if (ag && dg) {
        const k = keyingByGan[ag];
        if (k) {
          const ji = k.吉凶 === '吉' ? '吉' : (k.吉凶 === '凶' ? '凶' : '');
          const geText = k.格 ? `為${k.格}，` : '';
          lines.push(`<div><span class="kh">${ag}加${dg}：</span>${geText}${k.斷語 || ''}${ji ? `<span class="ji ${ji}">${ji}</span>` : ''}</div>`);
        } else {
          lines.push(`<div><span class="kh">${ag}加${dg}：</span><span class="empty">—</span></div>`);
        }
      }
      keyingHTML = lines.join('') || '<div class="empty">（無克應）</div>';
    } else {
      keyingHTML = `<div class="empty">（中宮寄坤，不列克應）</div>`;
    }

    const maHTML = hasMa ? `<span class="ma-star">馬</span>` : '';
    const kongHTML = hasKong ? `<span class="kong-mark">○</span>` : '';

    return `
      <div class="palace">
        ${maHTML}
        <div class="palace-header">
          <span>${g.name} · ${g.dir}</span>
          <span class="luoshu">${g.luoshu}</span>
        </div>
        <div class="palace-body">
          <div class="palace-left">
            <div class="shen">${shen[g.idx] || '—'}${kongHTML}</div>
            <div class="xing">${xing[g.idx] || '—'}</div>
            <div class="men">${men[g.idx] || '—'}</div>
          </div>
          <div class="palace-right">
            <div class="gan-tian">${tg || '　'}</div>
            <div class="gan-an">${ag || '　'}</div>
            <div class="gan-di">${dg || '　'}</div>
          </div>
        </div>
        <div class="palace-keying">${keyingHTML}</div>
      </div>
    `;
  }).join('');
}

// ============================================================
// 初始化
// ============================================================
document.addEventListener('DOMContentLoaded', () => {
  document.getElementById('qTime').value = nowLocalStr();
  document.getElementById('btnPaipan').addEventListener('click', paipan);
  document.getElementById('btnNow').addEventListener('click', () => {
    document.getElementById('qTime').value = nowLocalStr();
    paipan();
  });

  document.querySelectorAll('.region-btn').forEach(btn => {
    btn.addEventListener('click', () => {
      document.querySelectorAll('.region-btn').forEach(b => b.classList.remove('active'));
      btn.classList.add('active');
      currentRegion = btn.dataset.region;
      paipan();
    });
  });

  paipan();
});
</script>
</body>
</html>
