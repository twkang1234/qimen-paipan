<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>奇門遁甲排盤｜線上奇門排盤工具</title>
  <meta name="description" content="奇門遁甲線上排盤工具，支援符頭法、台北真太陽時、旬空、馬星、暗干與十干克應。">
  <style>
    :root {
      --bg-void: #030408;
      --fg-primary: #f5f8fc;
      --fg-dim: #9aa5bc;
      --fg-subtle: #4c5670;
      --singularity-cyan: #00f3ff;
      --portal-magenta: #e024c3;
      --accretion-gold: #ffbe3b;
      --hyper-white: #ffffff;
      --glass-panel: rgba(10, 14, 26, 0.65);
      --glass-border: rgba(255, 255, 255, 0.1);
      --glass-glow: rgba(0, 243, 255, 0.25);
      --font-sans: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang TC", "Noto Sans TC", "Microsoft JhengHei", sans-serif;
      --font-mono: "SF Mono", "Fira Code", "Courier New", monospace;
    }
    * { box-sizing: border-box; }
    html { background: var(--bg-void); scroll-behavior: smooth; }
    body {
      margin: 0;
      min-height: 100vh;
      overflow-x: hidden;
      background:
        radial-gradient(circle 900px at 12% -10%, rgba(0,243,255,.08), transparent 58%),
        radial-gradient(circle 820px at 92% 5%, rgba(224,36,195,.06), transparent 55%),
        #030408;
      color: var(--fg-primary);
      font-family: var(--font-sans);
      line-height: 1.6;
    }
    body::before {
      content: "";
      position: fixed;
      inset: 0;
      z-index: -2;
      pointer-events: none;
      opacity: .34;
      background-image:
        radial-gradient(circle at 15% 22%, rgba(255,255,255,.65) 0 1px, transparent 1.6px),
        radial-gradient(circle at 71% 16%, rgba(0,243,255,.7) 0 1px, transparent 1.7px),
        radial-gradient(circle at 84% 67%, rgba(255,255,255,.55) 0 1px, transparent 1.6px),
        radial-gradient(circle at 32% 78%, rgba(224,36,195,.65) 0 1px, transparent 1.7px);
      background-size: 210px 210px, 270px 270px, 320px 320px, 250px 250px;
    }
    body::after {
      content: "";
      position: fixed;
      inset: 0;
      z-index: -1;
      pointer-events: none;
      background:
        linear-gradient(rgba(255,255,255,.016) 1px, transparent 1px),
        linear-gradient(90deg, rgba(255,255,255,.016) 1px, transparent 1px);
      background-size: 64px 64px;
      mask-image: radial-gradient(circle at center, #000 12%, transparent 82%);
    }
    .page-topbar {
      position: sticky;
      top: 0;
      z-index: 50;
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 18px;
      width: min(1460px, calc(100% - 32px));
      margin: 0 auto;
      padding: 18px 0 12px;
      backdrop-filter: blur(14px);
    }
    .back-home {
      display: inline-flex;
      align-items: center;
      gap: 9px;
      padding: 9px 14px;
      border: 1px solid rgba(0,243,255,.25);
      border-radius: 999px;
      background: rgba(4,12,21,.64);
      color: #9feff4;
      text-decoration: none;
      font-family: var(--font-mono);
      font-size: .72rem;
      letter-spacing: .08em;
      transition: .25s ease;
    }
    .back-home:hover {
      border-color: rgba(0,243,255,.58);
      background: rgba(0,243,255,.09);
      box-shadow: 0 0 28px rgba(0,243,255,.10);
      transform: translateY(-1px);
    }
    .page-status {
      color: #66758c;
      font-family: var(--font-mono);
      font-size: .65rem;
      letter-spacing: .12em;
    }

    /* ==========================================================================
       光門後：奇門遁甲排盤工具
       視覺延續宇宙介面，但排盤區以閱讀穩定、資訊辨識為第一優先。
       ========================================================================== */
    #worldSecond {
      max-width: 1540px;
      padding: 104px 28px 76px;
    }

    .qimen-stage-header {
      display: grid;
      grid-template-columns: minmax(0, 1fr) auto;
      gap: 28px;
      align-items: end;
      margin: 0 auto 28px;
      max-width: 1460px;
    }

    .qimen-stage-kicker {
      display: inline-flex;
      align-items: center;
      gap: 10px;
      margin-bottom: 12px;
      color: var(--singularity-cyan);
      font-family: var(--font-mono);
      font-size: .72rem;
      letter-spacing: .22em;
    }

    .qimen-stage-kicker::before {
      content: "";
      width: 34px;
      height: 1px;
      background: var(--singularity-cyan);
      box-shadow: 0 0 14px rgba(0,243,255,.7);
    }

    .qimen-stage-title {
      margin: 0 0 10px;
      font-size: clamp(2.15rem, 4vw, 4rem);
      line-height: 1.08;
      letter-spacing: -.035em;
      background: linear-gradient(135deg, #fff 18%, #d6e6f8 56%, var(--singularity-cyan));
      -webkit-background-clip: text;
      background-clip: text;
      color: transparent;
    }

    .qimen-stage-desc {
      max-width: 760px;
      color: #98a7bf;
      font-size: .96rem;
      line-height: 1.8;
    }

    .qimen-engine-chip {
      justify-self: end;
      display: inline-flex;
      align-items: center;
      gap: 9px;
      padding: 9px 14px;
      border: 1px solid rgba(0,243,255,.24);
      border-radius: 999px;
      background: rgba(4,12,21,.62);
      backdrop-filter: blur(14px);
      color: #a9bccd;
      font-family: var(--font-mono);
      font-size: .68rem;
      letter-spacing: .12em;
      white-space: nowrap;
    }

    .qimen-engine-chip i {
      width: 7px;
      height: 7px;
      border-radius: 50%;
      background: var(--singularity-cyan);
      box-shadow: 0 0 12px var(--singularity-cyan);
    }

    #qimenTool {
      position: relative;
      max-width: 1460px;
      margin: 0 auto;
      padding: 24px;
      border: 1px solid rgba(140,181,220,.18);
      border-radius: 30px;
      overflow: hidden;
      background:
        radial-gradient(circle 720px at 8% -8%, rgba(0,243,255,.09), transparent 52%),
        radial-gradient(circle 640px at 92% 8%, rgba(224,36,195,.065), transparent 54%),
        linear-gradient(145deg, rgba(8,13,24,.94), rgba(4,7,14,.93));
      box-shadow:
        0 38px 100px rgba(0,0,0,.50),
        inset 0 1px 0 rgba(255,255,255,.035);
      isolation: isolate;
    }

    #qimenTool::before {
      content: "";
      position: absolute;
      inset: 0;
      z-index: -1;
      pointer-events: none;
      opacity: .22;
      background-image:
        linear-gradient(rgba(255,255,255,.022) 1px, transparent 1px),
        linear-gradient(90deg, rgba(255,255,255,.022) 1px, transparent 1px);
      background-size: 52px 52px;
      mask-image: linear-gradient(to bottom, #000, rgba(0,0,0,.45) 45%, transparent 100%);
    }

    #qimenTool .tool-heading {
      display: flex;
      align-items: flex-end;
      justify-content: space-between;
      gap: 24px;
      padding: 6px 4px 20px;
    }

    #qimenTool .tool-heading h3 {
      margin: 0 0 5px;
      color: #f3f7fb;
      font-size: clamp(1.45rem, 2.1vw, 2rem);
      letter-spacing: .06em;
    }

    #qimenTool .sub {
      color: #8291a8;
      font-size: .78rem;
      letter-spacing: .08em;
    }

    #qimenTool .tool-mark {
      font-family: var(--font-mono);
      font-size: .67rem;
      color: rgba(255,190,59,.84);
      letter-spacing: .16em;
      white-space: nowrap;
    }

    #qimenTool .toolbar {
      display: grid;
      grid-template-columns: minmax(250px, 1fr) auto auto;
      gap: 12px;
      align-items: end;
      padding: 18px;
      margin-bottom: 14px;
      border: 1px solid rgba(255,255,255,.09);
      border-radius: 18px;
      background: rgba(11,17,29,.76);
      backdrop-filter: blur(18px);
    }

    #qimenTool .field label {
      display: block;
      margin-bottom: 6px;
      color: #7f8ba1;
      font-family: var(--font-mono);
      font-size: .67rem;
      letter-spacing: .10em;
    }

    #qimenTool .field input {
      width: 100%;
      min-height: 44px;
      padding: 9px 12px;
      border: 1px solid rgba(133,162,198,.20);
      border-radius: 10px;
      outline: none;
      background: #0d1421;
      color: #eef4fb;
      font: inherit;
      font-size: .9rem;
      color-scheme: dark;
      transition: border-color .25s, box-shadow .25s, background .25s;
    }

    #qimenTool .field input:focus {
      border-color: rgba(0,243,255,.55);
      box-shadow: 0 0 0 3px rgba(0,243,255,.07);
      background: #101a29;
    }

    #qimenTool .btn,
    #qimenTool .region-btn {
      min-height: 44px;
      border-radius: 10px;
      font: inherit;
      cursor: none;
      transition: transform .22s ease, border-color .25s, background .25s, box-shadow .25s, color .25s;
    }

    #qimenTool .btn {
      padding: 9px 22px;
      border: 1px solid rgba(255,190,59,.62);
      background: linear-gradient(180deg, #f1cc71, #b78b36);
      color: #151007;
      font-weight: 800;
      letter-spacing: .12em;
      box-shadow: 0 8px 24px rgba(255,190,59,.10);
    }

    #qimenTool .btn:hover {
      transform: translateY(-2px);
      box-shadow: 0 12px 30px rgba(255,190,59,.18);
    }

    #qimenTool .btn.ghost {
      border-color: rgba(0,243,255,.32);
      background: rgba(0,243,255,.045);
      color: #87eaf0;
      box-shadow: none;
      font-weight: 600;
    }

    #qimenTool .btn.ghost:hover {
      border-color: rgba(0,243,255,.60);
      background: rgba(0,243,255,.085);
      box-shadow: 0 10px 28px rgba(0,243,255,.08);
    }

    #qimenTool .region-bar {
      grid-column: 1 / -1;
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 9px;
      padding-top: 14px;
      margin-top: 2px;
      border-top: 1px solid rgba(255,255,255,.065);
    }

    #qimenTool .region-label {
      margin-right: 6px;
      color: #78869d;
      font-size: .72rem;
      letter-spacing: .08em;
    }

    #qimenTool .region-btn {
      min-height: 36px;
      padding: 7px 18px;
      border: 1px solid rgba(133,162,198,.18);
      background: #0c1320;
      color: #8e9bb0;
      font-size: .8rem;
      letter-spacing: .08em;
    }

    #qimenTool .region-btn:hover {
      color: #d8fafd;
      border-color: rgba(0,243,255,.34);
    }

    #qimenTool .region-btn.active {
      color: #061316;
      border-color: rgba(0,243,255,.68);
      background: linear-gradient(180deg, #8ff9ff, #45cbd2);
      box-shadow: 0 0 22px rgba(0,243,255,.13);
      font-weight: 800;
    }

    #qimenTool .info {
      display: grid;
      grid-template-columns: repeat(7, minmax(0, 1fr));
      gap: 1px;
      margin-bottom: 14px;
      overflow: hidden;
      border: 1px solid rgba(255,255,255,.08);
      border-radius: 16px;
      background: rgba(255,255,255,.065);
    }

    #qimenTool .info > div {
      min-height: 64px;
      padding: 11px 12px;
      background: rgba(9,14,24,.92);
      color: #75839a;
      font-family: var(--font-mono);
      font-size: .64rem;
      line-height: 1.35;
      letter-spacing: .04em;
    }

    #qimenTool .info span {
      display: block;
      margin: 5px 0 0;
      color: #f0c96b;
      font-family: var(--font-sans);
      font-size: .84rem;
      font-weight: 750;
      letter-spacing: .02em;
      overflow-wrap: anywhere;
    }

    #qimenTool .grid {
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: 10px;
      margin-bottom: 14px;
    }

    #qimenTool .palace {
      --qmx: 50%;
      --qmy: 28%;
      position: relative;
      display: flex;
      flex-direction: column;
      min-height: 258px;
      overflow: hidden;
      border: 1px solid rgba(117,144,178,.18);
      border-radius: 16px;
      background: rgba(12,18,30,.88);
      box-shadow: inset 0 1px 0 rgba(255,255,255,.022);
      transition: transform .28s cubic-bezier(.16,1,.3,1), border-color .28s, box-shadow .28s;
    }

    #qimenTool .palace::before {
      content: "";
      position: absolute;
      inset: 0;
      pointer-events: none;
      opacity: 0;
      z-index: 0;
      background:
        radial-gradient(circle 300px at var(--qmx) var(--qmy), rgba(0,243,255,.085), rgba(224,36,195,.025) 40%, transparent 70%);
      transition: opacity .35s ease;
    }

    #qimenTool .palace:hover {
      transform: translateY(-2px);
      border-color: rgba(0,243,255,.34);
      box-shadow: 0 18px 44px rgba(0,0,0,.22);
    }

    #qimenTool .palace:hover::before { opacity: 1; }

    #qimenTool .palace > * {
      position: relative;
      z-index: 1;
    }

    #qimenTool .palace-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      min-height: 42px;
      padding: 8px 13px;
      border-bottom: 1px solid rgba(255,255,255,.07);
      background: rgba(255,255,255,.025);
      color: #efb44f;
      font-size: .82rem;
      font-weight: 800;
    }

    #qimenTool .palace-header .name { letter-spacing: .08em; }
    #qimenTool .palace-header .luoshu { margin-left: 2px; color: #f2c86c; }
    #qimenTool .palace-header .dir {
      margin-left: 8px;
      color: #6f7c92;
      font-family: var(--font-mono);
      font-size: .62rem;
      letter-spacing: .04em;
    }

    #qimenTool .palace-main {
      display: flex;
      justify-content: space-between;
      gap: 10px;
      padding: 12px 13px;
      border-bottom: 1px solid rgba(255,255,255,.065);
    }

    #qimenTool .palace-left,
    #qimenTool .palace-right {
      display: flex;
      flex-direction: column;
      gap: 6px;
      font-size: .91rem;
      line-height: 1.35;
      letter-spacing: .10em;
    }

    #qimenTool .palace-right {
      align-items: flex-end;
      min-width: 46px;
    }

    #qimenTool .palace-left .shen { color: #ff7f87; }
    #qimenTool .palace-left .xing { color: #72c9f4; }
    #qimenTool .palace-left .men { color: #e6bd6b; }
    #qimenTool .palace-right .gan-tian { color: #ff838a; font-weight: 800; }
    #qimenTool .palace-right .gan-di { color: #75e0aa; }
    #qimenTool .palace-right .gan-an { color: #f0c96b; }

    #qimenTool .palace-keying {
      flex: 1;
      padding: 10px 13px 12px;
      color: #9fa9b8;
      font-size: .73rem;
      line-height: 1.68;
    }

    #qimenTool .palace-keying .line + .line { margin-top: 5px; }
    #qimenTool .palace-keying .kh { color: #f0c96b; font-weight: 760; }
    #qimenTool .palace-keying .empty { color: #57647a; }

    #qimenTool .ma-star {
      position: absolute;
      top: 8px;
      right: 8px;
      z-index: 4;
      padding: 2px 7px;
      border-radius: 5px;
      background: linear-gradient(135deg, #f04cc4, #9c3cff);
      color: #fff;
      font-family: var(--font-mono);
      font-size: .63rem;
      font-weight: 800;
      letter-spacing: .08em;
      box-shadow: 0 0 18px rgba(224,36,195,.22);
    }

    #qimenTool .kong-mark {
      display: inline-block;
      margin-left: 5px;
      vertical-align: middle;
      color: #39e2a0;
      font-size: 1rem;
      font-weight: 800;
      text-shadow: 0 0 12px rgba(57,226,160,.45);
    }

    #qimenTool .notice {
      padding: 12px 14px;
      border: 1px solid rgba(255,190,59,.11);
      border-left: 2px solid rgba(255,190,59,.62);
      border-radius: 10px;
      background: rgba(255,190,59,.035);
      color: #7e899b;
      font-size: .71rem;
      line-height: 1.75;
    }

    #qimenTool footer {
      padding: 18px 0 0;
      color: #48556a;
      text-align: center;
      font-family: var(--font-mono);
      font-size: .64rem;
      letter-spacing: .08em;
    }

    .qimen-return-wrap {
      max-width: 1460px;
      margin: 26px auto 0;
      text-align: center;
    }

    @media (max-width: 1180px) {
      #qimenTool .info { grid-template-columns: repeat(4, minmax(0, 1fr)); }
    }

    @media (max-width: 900px) {
      #worldSecond { padding: 96px 16px 56px; }
      .qimen-stage-header { grid-template-columns: 1fr; align-items: start; }
      .qimen-engine-chip { justify-self: start; }
      #qimenTool { padding: 14px; border-radius: 22px; }
      #qimenTool .toolbar { grid-template-columns: 1fr 1fr; }
      #qimenTool .field { grid-column: 1 / -1; }
      #qimenTool .info { grid-template-columns: repeat(2, minmax(0, 1fr)); }
      #qimenTool .grid { grid-template-columns: 1fr; }
      #qimenTool .palace { min-height: auto; }
      #qimenTool .tool-heading { align-items: flex-start; flex-direction: column; }
      #qimenTool .tool-mark { white-space: normal; }
    }

    @media (max-width: 560px) {
      #qimenTool .toolbar { grid-template-columns: 1fr; }
      #qimenTool .field,
      #qimenTool .region-bar { grid-column: auto; }
      #qimenTool .btn { width: 100%; }
      #qimenTool .info { grid-template-columns: 1fr 1fr; }
      #qimenTool .info > div { min-height: 58px; }
      .qimen-stage-title { font-size: 2rem; }
    }


    #worldSecond {
      opacity: 1 !important;
      pointer-events: auto !important;
      transform: none !important;
      max-width: none;
      margin: 0;
      padding-top: 30px;
    }
    .qimen-return-wrap .btn-return-portal {
      display: inline-flex;
      align-items: center;
      gap: 10px;
      padding: 13px 20px;
      border: 1px solid rgba(0,243,255,.32);
      border-radius: 999px;
      background: rgba(0,243,255,.05);
      color: var(--singularity-cyan);
      text-decoration: none;
      font-family: var(--font-mono);
      font-size: .76rem;
      letter-spacing: .1em;
      transition: .3s ease;
    }
    .qimen-return-wrap .btn-return-portal:hover {
      background: var(--singularity-cyan);
      color: #001014;
      box-shadow: 0 0 30px rgba(0,243,255,.25);
      transform: translateY(-2px);
    }
    @media (max-width: 700px) {
      .page-status { display: none; }
      .page-topbar { width: min(100% - 24px, 1460px); }
    }
  </style>
</head>
<body>
  <div class="page-topbar">
    <a class="back-home" href="index.html">← 返回光門首頁</a>
    <div class="page-status">QIMEN DIMENSION // CORE ONLINE</div>
  </div>

  <section id="worldSecond">
    <header class="qimen-stage-header">
      <div>
        <div class="qimen-stage-kicker">QIMEN CORE // DIMENSIONAL CHART</div>
        <h1 class="qimen-stage-title">奇門遁甲排盤</h1>
        <p class="qimen-stage-desc">進入奇門光門後直接抵達排盤核心。畫面保留宇宙介面的沉浸感，但九宮、時間、旬空、馬星與十干克應皆以清楚閱讀為優先。</p>
      </div>
      <div class="qimen-engine-chip"><i></i><span>QIMEN ENGINE ONLINE</span></div>
    </header>

    <main id="qimenTool" class="qimen-tool" aria-label="奇門遁甲排盤工具">
      <div class="tool-heading">
        <div>
          <h3>奇門遁甲排盤</h3>
          <div class="sub">符頭法 · 真太陽時（台北） · 十干克應 · 馬星 · 旬空 · 暗干</div>
        </div>
        <div class="tool-mark">TIME → SOLAR CORRECTION → NINE PALACES</div>
      </div>

      <div class="toolbar">
        <div class="field">
          <label for="qTime">起局時間（北京時間）</label>
          <input type="datetime-local" id="qTime">
        </div>
        <button class="btn" id="btnPaipan" type="button">起 局</button>
        <button class="btn ghost" id="btnNow" type="button">用現在時間</button>

        <div class="region-bar">
          <span class="region-label">真太陽時地區：</span>
          <button class="region-btn active" data-region="台北" type="button">台北</button>
          <button class="region-btn" data-region="無" type="button">不校正</button>
        </div>
      </div>

      <div class="info" id="panInfo" aria-live="polite"></div>
      <div class="grid" id="palaceGrid"></div>
      <div class="notice" id="noticeBar"></div>

      <footer>qimen2.standalone · 符頭法 · 資料僅供參考</footer>
    </main>

    <div class="qimen-return-wrap">
      <a class="btn-return-portal" href="index.html"><span>⟲</span><span>返回光門首頁</span></a>
    </div>
  </section>

  <script src="qimen2.standalone.min.js"></script>
  <script>
const REGIONS = {
  '台北': { 經度: 121.31, 時區: 8, 說明: '台北（UTC+8）' },
  '無':   { 經度: 120,    時區: 8, 說明: '不校正' }
};
let currentRegion = '台北';

function getEquationOfTime(date) {
  const start = new Date(date.getFullYear(), 0, 0);
  const dayOfYear = Math.floor((date - start) / 86400000);
  const B = 2 * Math.PI * (dayOfYear - 81) / 364;
  return 9.87 * Math.sin(2 * B) - 7.53 * Math.cos(B) - 1.5 * Math.sin(B);
}
function getRegionOffset(localDate, regionName) {

  const 均時差 = getEquationOfTime(localDate);
  return 經度校正 + 均時差;
}

function computeAnGan(obj) {
  const zhiFuGongChar = obj.值符落宮 || '';
  const GONG_CHAR_TO_LUOSHU = {
    '坎': 1, '坤': 2, '震': 3, '巽': 4, '中': 5,
    '乾': 6, '兌': 7, '艮': 8, '離': 9
  };
  const startLuoshu = GONG_CHAR_TO_LUOSHU[zhiFuGongChar];
  if (!startLuoshu) return {};

  const NINE_GAN = ['戊','己','庚','辛','壬','癸','丙','乙','丁'];
  const anGanMap = {};
  let ganIdx = 0;
  let luoshu = startLuoshu;
  let steps = 0;
  while (ganIdx < 8 && steps < 20) {
    if (luoshu !== 5) {
      anGanMap[luoshu] = NINE_GAN[ganIdx];
      ganIdx++;
    }
    luoshu = ((luoshu - 2 + 9) % 9) + 1;
    steps++;
  }
  return anGanMap;
}

function pad(n) { return String(n).padStart(2, '0'); }
function nowLocalStr() {
  const d = new Date();
  return `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}T${pad(d.getHours())}:${pad(d.getMinutes())}`;
}
function toQimenDatetime(localStr, regionName) {
  const d = new Date(localStr);
  const offset = getRegionOffset(d, regionName);
  const corrected = new Date(d.getTime() + offset * 60 * 1000);
  return {
    datetime: `${corrected.getFullYear()}${pad(corrected.getMonth()+1)}${pad(corrected.getDate())}${pad(corrected.getHours())}`,
    displayTime: corrected,
    offset: offset
  };
}

function paipan() {
  const timeStr = document.getElementById('qTime').value;
  if (!timeStr) { alert('請選擇時間'); return; }

  const { datetime, displayTime, offset } = toQimenDatetime(timeStr, currentRegion);
  let chart, obj, patterns;
  try {
    chart = Qimen.generateChartByDatetime(datetime, { 定局法: '符頭' });
    obj = Qimen.chartToObject(chart);
    patterns = Qimen.detectPatterns(obj);
  } catch (e) {
    document.getElementById('panInfo').innerHTML = `<div style="color:#e07b7b">排盤錯誤：${e.message}</div>`;
    document.getElementById('palaceGrid').innerHTML = '';
    return;
  }

  const shiZhu = obj.時柱 || '';
  const shiGan = shiZhu[0] || '';
  const shiZhi = shiZhu[1] || '';

  const maZhi = getMaZhi(shiZhi);
  const xunShou = getXunShou(shiGan, shiZhi);
  const kongZhi = xunShou ? (XUN_KONG[xunShou] || []) : [];
  const anGanMap = computeAnGan(obj);

  renderInfo(obj, displayTime, currentRegion, maZhi, xunShou, kongZhi, offset);
  renderGrid(obj, patterns, maZhi, kongZhi, anGanMap);
}

    if (idx !== undefined) anGanByIdx[idx] = anGanMap[luoshu];
  }

  grid.innerHTML = GONG_LAYOUT.map(g => {
    const gongChar = GONG_CHAR[g.idx];
    const tg = tian[g.idx] || '';
    const dg = di[g.idx] || '';
    const ag = anGanByIdx[g.idx] || '';

    const hasMa = maZhi && gongHasZhi(g, maZhi);
    const hasKong = kongZhi.some(kz => gongHasZhi(g, kz));

    let keyingHTML = '';
    if (gongChar !== '中') {
      const lines = [];

      if (tg && dg) {
        const k = getKeyingFromTable(tg, dg);
        if (k) {
          const geText = k.格 ? `為${k.格}，` : '';
          lines.push(`<div class="line"><span class="kh">${tg}加${dg}：</span>${geText}${k.斷語 || ''}</div>`);
        } else {
          lines.push(`<div class="line"><span class="kh">${tg}加${dg}：</span><span class="empty">（無資料）</span></div>`);
        }
      }

      if (ag && dg) {
        const k2 = getKeyingFromTable(ag, dg);
        if (k2) {
          const geText = k2.格 ? `為${k2.格}，` : '';
          lines.push(`<div class="line"><span class="kh">${ag}加${dg}：</span>${geText}${k2.斷語 || ''}</div>`);
        } else {
          lines.push(`<div class="line"><span class="kh">${ag}加${dg}：</span><span class="empty">（無資料）</span></div>`);
        }
      }

      keyingHTML = lines.join('') || '<div class="empty">（無克應）</div>';
    } else {
      keyingHTML = `<div class="empty">（中宮寄坤，不列克應）</div>`;
    }

    const maHTML = hasMa ? `<span class="ma-star">馬</span>` : '';
    const kongHTML = hasKong ? `<span class="kong-mark">○</span>` : '';

    return `
      <div class="palace">
        ${maHTML}
        <div class="palace-header">
          <span><span class="name">${g.name}</span> <span class="luoshu">(${g.luoshu})</span></span>
          <span class="dir">${g.dir}（${g.wuxing}）</span>
        </div>
        <div class="palace-main">
          <div class="palace-left">
            <div class="shen">${shen[g.idx] || '—'}${kongHTML}</div>
            <div class="xing">${xing[g.idx] || '—'}</div>
            <div class="men">${men[g.idx] || '—'}</div>
          </div>
          <div class="palace-right">
            <div class="gan-tian">${tg || '　'}</div>
            <div class="gan-di">${dg || '　'}</div>
            <div class="gan-an">${ag || '　'}</div>
          </div>
        </div>
        <div class="palace-keying">${keyingHTML}</div>
      </div>
    `;
  }).join('');

  grid.querySelectorAll('.palace').forEach(card => {
    card.addEventListener('mousemove', (e) => {
      const rect = card.getBoundingClientRect();
      card.style.setProperty('--qmx', `${((e.clientX - rect.left) / rect.width) * 100}%`);
      card.style.setProperty('--qmy', `${((e.clientY - rect.top) / rect.height) * 100}%`);
    });
  });
}

document.addEventListener('DOMContentLoaded', () => {
  document.getElementById('qTime').value = nowLocalStr();
  document.getElementById('btnPaipan').addEventListener('click', paipan);
  document.getElementById('btnNow').addEventListener('click', () => {
    document.getElementById('qTime').value = nowLocalStr();
    paipan();
  });

  document.querySelectorAll('.region-btn').forEach(btn => {
    btn.addEventListener('click', () => {
      document.querySelectorAll('.region-btn').forEach(b => b.classList.remove('active'));
      btn.classList.add('active');
      currentRegion = btn.dataset.region;
      paipan();
    });
  });

  paipan();
});
  </script>
</body>
</html>
