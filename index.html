<html lang="zh-Hant">

<title>奇門遁甲排盤</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {

    color: #e8e3d8;

  .container { max-width: 1300px; margin: 0 auto; }

  .sub { text-align: center; color: #9a958a; font-size: 13px; margin-bottom: 28px; }

  }
  .field label { display: block; font-size: 12px; color: #9a958a; margin-bottom: 4px; }
  .field input {
    background: #1c2230; border: 1px solid #2a3142; color: #e8e3d8;

  .btn {
    background: linear-gradient(180deg, #c9a961, #8a7440); color: #1a1408;
    border: none; padding: 9px 24px; border-radius: 6px;
    font-family: inherit; font-size: 14px; font-weight: 700;
    cursor: pointer; letter-spacing: 2px;
  }
  .btn:hover { filter: brightness(1.1); }
  .btn.ghost { background: transparent; border: 1px solid #8a7440; color: #c9a961; font-weight: 400; }

  .region-bar {
    display: flex; flex-wrap: wrap; gap: 10px; margin-top: 12px;
    padding-top: 14px; border-top: 1px solid #2a3142; width: 100%;
  }
  .region-btn {
    background: #1c2230; border: 1px solid #2a3142; color: #9a958a;
    padding: 8px 22px; border-radius: 6px; font-family: inherit;

  .region-label { font-size: 12px; color: #9a958a; align-self: center; margin-right: 8px; letter-spacing: 1px; }

  .palace {
    background: #151922; border: 1px solid #2a3142; border-radius: 8px;
    padding: 0; display: flex; flex-direction: column;
    min-height: 280px; position: relative; overflow: hidden;
  }
  .palace-header {
    display: flex; justify-content: space-between; align-items: center;
    font-size: 14px; color: #e8a045; font-weight: 700;
    padding: 8px 14px;

  .palace-header .luoshu { color: #e8a045; font-size: 16px; }
  .palace-header .dir {

    gap: 8px;

  .palace-left .men  { color: #d8b26f; }
  .palace-right {

    flex-direction: column;
    align-items: flex-end;

  .palace-right .gan-an   { color: #c9a961; font-size: 15px; letter-spacing: 2px; }
  .palace-right .gan-di   { color: #7be0a8; font-size: 15px; letter-spacing: 2px; }

  .palace-dots {
    display: flex; gap: 6px;
    padding: 6px 14px;
    border-bottom: 1px solid #2a3142;
  }
  .palace-dots span {
    width: 10px; height: 10px; border-radius: 50%;
    background: #3a4152;
  }
  .palace-dots span:nth-child(1) { background: #d4a017; } /* 金黃 */
  .palace-dots span:nth-child(2) { background: #c0392b; } /* 紅 */
  .palace-dots span:nth-child(3) { background: #2980b9; } /* 藍 */
  .palace-dots span:nth-child(4) { background: #27ae60; } /* 綠 */
  .palace-dots span:nth-child(5) { background: #95a5a6; } /* 灰 */

  .palace-keying {
    padding: 10px 14px;
    font-size: 12.5px;
    color: #c8c3b8;
    line-height: 1.7;
    flex: 1;

  .palace-keying .kh { color: #c9a961; font-weight: 700; }
  .palace-keying .empty { color: #5a6378; }

  .palace-tags {
    display: flex; flex-wrap: wrap; gap: 4px;
    padding: 0 14px 8px;
  }
  .tag {
    font-size: 11px;
    padding: 1px 8px;
    border-radius: 3px;
    letter-spacing: 1px;
  }

  .tag.吉 { background: rgba(39,174,96,.25); color: #7be0a8; }
  .tag.orange { background: rgba(230,126,34,.25); color: #e8a045; }

  .ma-star {
    position: absolute; top: 8px; right: 8px;
    background: #d040d0; color: #fff;
    font-size: 11px; font-weight: 700;
    padding: 1px 6px; border-radius: 3px;
    letter-spacing: 1px; z-index: 2;
  }

  .kong-mark {
    display: inline-block; color: #27ae60;
    font-size: 16px; margin-left: 4px;
    vertical-align: middle; font-weight: 700;

  .notice {
    padding: 12px 16px; background: rgba(122,31,31,.15);

    .grid { grid-template-columns: 1fr; }

<script>
const REGIONS = {
  '台北': { 經度: 121.31, 時區: 8, 說明: '台北（UTC+8）' },
  '無':   { 經度: 120,    時區: 8, 說明: '不校正' }
};
let currentRegion = '台北';

function getEquationOfTime(date) {
  const start = new Date(date.getFullYear(), 0, 0);
  const dayOfYear = Math.floor((date - start) / 86400000);
  const B = 2 * Math.PI * (dayOfYear - 81) / 364;
  return 9.87 * Math.sin(2 * B) - 7.53 * Math.cos(B) - 1.5 * Math.sin(B);
}
function getRegionOffset(localDate, regionName) {
  if (regionName === '無') return 0;
  const r = REGIONS[regionName];
  const 經度校正 = (r.經度 - 120) * 4;
  const 均時差 = getEquationOfTime(localDate);
  return 經度校正 + 均時差;
}

  '甲子': ['戌','亥'], '甲戌': ['申','酉'], '甲申': ['午','未'],
  '甲午': ['辰','巳'], '甲辰': ['寅','卯'], '甲寅': ['子','丑']

function getXunShou(shiGan, shiZhi) {
  const ganIdx = '甲乙丙丁戊己庚辛壬癸'.indexOf(shiGan);
  const zhiIdx = ZHI.indexOf(shiZhi);
  if (ganIdx < 0 || zhiIdx < 0) return null;
  const xunZhiIdx = (zhiIdx - ganIdx + 12) % 12;
  return '甲' + ZHI[xunZhiIdx];
}
function getMaZhi(shiZhi) {
  const g1 = ['申','子','辰'], g2 = ['寅','午','戌'], g3 = ['巳','酉','丑'], g4 = ['亥','卯','未'];
  if (g1.includes(shiZhi)) return '寅';
  if (g2.includes(shiZhi)) return '申';
  if (g3.includes(shiZhi)) return '亥';
  if (g4.includes(shiZhi)) return '巳';
  return null;
}
function gongHasZhi(gong, zhi) { return gong.zhi.includes(zhi); }

function computeAnGan(obj) {
  const zhiFuGongChar = obj.值符落宮 || '';
  const GONG_CHAR_TO_LUOSHU = {
    '坎': 1, '坤': 2, '震': 3, '巽': 4, '中': 5,
    '乾': 6, '兌': 7, '艮': 8, '離': 9
  };
  const startLuoshu = GONG_CHAR_TO_LUOSHU[zhiFuGongChar];
  if (!startLuoshu) return {};

  const NINE_GAN = ['戊','己','庚','辛','壬','癸','丙','乙','丁'];
  const anGanMap = {};
  let ganIdx = 0;
  let luoshu = startLuoshu;
  let steps = 0;
  while (ganIdx < 8 && steps < 20) {
    if (luoshu !== 5) {
      anGanMap[luoshu] = NINE_GAN[ganIdx];
      ganIdx++;
    }
    luoshu = ((luoshu - 2 + 9) % 9) + 1;
    steps++;
  }
  return anGanMap;
}
